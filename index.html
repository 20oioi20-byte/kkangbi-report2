<style>
  :root{
    --navy:#1B2A4A; --navy-light:#2E4370; --paper:#FAFAF8; --line:#D8D9DC;
    --ink:#1F2328; --sub:#6B7178; --up:#C0392B; --down:#1F5FA8; --accent:#B5893A;
    --kt-black:#000000; --kt-gray:#4C4C4E; --kt-lightgray:#A2A4A3; --kt-red:#FE2E36;
    --sidebar-w:250px;
  }
  *{box-sizing:border-box;}
  .rt-wrap{
    font-family:'Noto Sans KR','Malgun Gothic',-apple-system,sans-serif;
    background:var(--paper); color:var(--ink); font-size:13.5px; line-height:1.5;
    border:1px solid var(--line); border-radius:8px; overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    display:flex; min-height:640px; max-width:1180px; margin:0 auto;
  }
  /* ---------- sidebar (KT 브랜드 컬러) ---------- */
  .rt-sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--kt-black); color:#fff;
    display:flex; flex-direction:column; max-height:800px;
  }
  .rt-sidebar-head{ padding:16px 16px 10px; }
  .rt-sidebar-head h1{ font-size:15px; font-weight:700; margin:0 0 2px; }
  .rt-sidebar-head .sub{ font-size:10.5px; color:#B5B5B7; }
  .rt-sb-status{ font-size:10px; color:#9A9A9C; margin-top:6px; }
  .rt-search{ padding:0 16px 10px; }
  .rt-search input{
    width:100%; border:none; border-radius:5px; padding:8px 10px; font-size:12.5px;
    background:rgba(255,255,255,.1); color:#fff;
  }
  .rt-search input::placeholder{ color:#8A8A8C; }
  .rt-nav-item{
    padding:10px 16px; cursor:pointer; font-size:13px; font-weight:600;
    color:#D4D4D5; border-left:3px solid transparent;
  }
  .rt-nav-item:hover{ background:rgba(255,255,255,.06); }
  .rt-nav-item.active{ background:rgba(255,255,255,.08); border-left-color:var(--kt-red); color:#fff; }
  .rt-center-list{ flex:1; overflow-y:auto; padding:4px 0; }
  .rt-center-group-label{ font-size:10.5px; color:#8A8A8C; padding:12px 16px 4px; text-transform:uppercase; letter-spacing:.4px; }
  .rt-center-item{
    padding:9px 16px 9px 20px; cursor:pointer; font-size:12.8px; color:#D4D4D5;
    border-left:3px solid transparent; display:flex; justify-content:space-between; align-items:center; gap:6px;
  }
  .rt-center-item:hover{ background:rgba(255,255,255,.06); }
  .rt-center-item.active{ background:rgba(255,255,255,.08); border-left-color:var(--kt-red); color:#fff; font-weight:700; }
  .rt-center-item .badge{ font-size:9.5px; background:rgba(255,255,255,.12); padding:1px 6px; border-radius:8px; color:#C8C8C9; flex-shrink:0; }
  .rt-add-center-btn{
    margin:10px 16px 16px; padding:9px; border-radius:5px; border:1px dashed var(--kt-gray);
    background:transparent; color:#C8C8C9; font-size:12.5px; cursor:pointer; font-weight:600;
  }
  .rt-add-center-btn:hover{ background:rgba(255,255,255,.06); color:#fff; border-color:var(--kt-red); }

  /* ---------- main content ---------- */
  .rt-main{ flex:1; overflow-y:auto; max-height:800px; padding:22px 26px 40px; background:#fff; }
  .rt-main-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .rt-main-header h2{ font-size:18px; font-weight:700; color:var(--kt-black); margin:0 0 4px; }
  .rt-main-header .desc{ font-size:12px; color:var(--sub); }
  .rt-subtabs{ display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .rt-subtab{ padding:8px 14px; cursor:pointer; font-size:12.8px; font-weight:600; color:var(--sub); border-bottom:2px solid transparent; }
  .rt-subtab.active{ color:var(--kt-black); border-bottom-color:var(--kt-red); }

  .rt-row{ display:flex; gap:14px; margin-bottom:14px; flex-wrap:wrap; align-items:flex-end; }
  .rt-field{ display:flex; flex-direction:column; gap:4px; flex:1; min-width:140px; }
  .rt-field label{ font-size:11.5px; color:var(--sub); font-weight:600; }
  .rt-field input, .rt-field select, .rt-field textarea{
    border:1px solid var(--line); border-radius:4px; padding:8px 10px; font-size:13px;
    font-family:inherit; background:#fff;
  }
  .rt-field input:focus, .rt-field select:focus, .rt-field textarea:focus{ outline:none; border-color:var(--kt-red); }
  .rt-status{ font-size:11.5px; padding:6px 10px; border-radius:4px; background:#F2F2F2; color:var(--kt-gray); display:inline-block; }
  .rt-status.warn{ background:#FDECEC; color:var(--kt-red); }
  .rt-section-title{ font-size:12.5px; font-weight:700; color:var(--kt-black); margin:20px 0 9px; padding-bottom:5px; border-bottom:1px solid var(--line); }
  table.rt-table{ width:100%; border-collapse:collapse; font-size:12.6px; margin-bottom:6px; background:#fff; }
  table.rt-table th, table.rt-table td{ border:1px solid #B9BCC2; padding:6px 8px; text-align:center; }
  table.rt-table th{ background:#E7E9EE; font-weight:700; color:var(--navy); }
  table.rt-table td.rt-label{ background:#F5F5F3; font-weight:600; text-align:left; padding-left:10px; }
  table.rt-table td.rt-num-input input{ width:100%; border:none; background:transparent; text-align:right; font-size:12.6px; font-family:inherit; padding:2px; }
  table.rt-table td.rt-num-input input:focus{ outline:1px solid var(--navy-light); background:#fff; }
  table.rt-table tr.rt-total td{ font-weight:700; background:#F0F0EC; }
  .rt-arrow-up{ color:var(--up); font-weight:700; }
  .rt-arrow-down{ color:var(--down); font-weight:700; }
  .rt-arrow-flat{ color:var(--sub); }
  textarea.rt-comment{ width:100%; min-height:60px; resize:vertical; }
  .rt-actions{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .rt-btn{ border:none; border-radius:4px; padding:9px 16px; font-size:12.6px; font-weight:700; cursor:pointer; font-family:inherit; }
  .rt-btn-primary{ background:var(--kt-red); color:#fff; }
  .rt-btn-primary:hover{ background:#D81F27; }
  .rt-btn-ghost{ background:#fff; color:var(--kt-black); border:1px solid var(--kt-black); }
  .rt-btn-ghost:hover{ background:#F2F2F2; }
  .rt-btn-danger{ background:#fff; color:var(--up); border:1px solid var(--up); }
  .rt-btn-danger:hover{ background:#FDF0EE; }
  .rt-btn-sm{ padding:5px 10px; font-size:11.5px; }
  .rt-copy-target{ border:1px dashed var(--line); padding:12px; border-radius:4px; margin-top:8px; background:#fff; }
  .rt-copy-section{ margin-bottom:14px; }
  .rt-copy-section-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .rt-copy-section-head span{ font-size:12px; font-weight:700; color:var(--kt-black); }
  .rt-mini-copy-btn{ border:1px solid var(--kt-black); background:#fff; color:var(--kt-black); font-size:11px; font-weight:700; padding:3px 9px; border-radius:4px; cursor:pointer; }
  .rt-mini-copy-btn:hover{ background:#F2F2F2; }
  .rt-toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--kt-black); color:#fff;
    padding:10px 18px; border-radius:4px; font-size:12.6px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:999; }
  .rt-toast.show{ opacity:1; }
  .rt-hint{ font-size:11px; color:var(--sub); margin-top:3px; }

  .rt-history-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--line); border-radius:5px; margin-bottom:6px; background:#FAFAF9; }
  .rt-history-row .info{ font-size:12.6px; }
  .rt-history-row .info b{ color:var(--kt-black); }
  .rt-history-row .ops{ display:flex; gap:6px; }
  .rt-empty{ color:var(--sub); font-size:12.6px; padding:20px; text-align:center; border:1px dashed var(--line); border-radius:6px; }

  .rt-modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:1000; }
  .rt-modal{ background:#fff; border-radius:8px; padding:22px 24px; width:440px; max-width:92vw; max-height:85vh; overflow-y:auto; }
  .rt-modal h3{ margin:0 0 14px; font-size:15px; color:var(--kt-black); }
  .rt-modal .rt-field{ margin-bottom:10px; }
  .rt-checkbox-row{ display:flex; align-items:center; gap:6px; font-size:12.6px; margin-bottom:4px; }
  .rt-checkbox-row input{ width:auto; }
  .rt-modal-section-title{ font-size:12.5px; font-weight:700; color:var(--kt-black); margin:18px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line); }
  .rt-modal .rt-hint{ margin:-4px 0 10px; }

  .rt-summary-table{ width:100%; border-collapse:collapse; font-size:12.6px; margin-bottom:20px; }
  .rt-summary-table th, .rt-summary-table td{ border:1px solid var(--line); padding:8px 10px; text-align:left; }
  .rt-summary-table th{ background:#F0F2F5; color:var(--kt-black); }
  .rt-summary-table tr:hover td{ background:#FAFBFD; cursor:pointer; }
  .rt-history-row{ transition:box-shadow .15s; }
  .rt-history-row:hover{ box-shadow:0 2px 6px rgba(0,0,0,.06); }

  .rt-ai-box{ border:1px solid var(--line); border-radius:5px; padding:12px; margin-bottom:16px; background:#FAFBFD; }
  .rt-ai-box .rt-row{ margin-bottom:8px; }
  input[type="file"]{ font-size:12px; }

  @media (max-width: 760px) and (min-width: 481px){
    .rt-sidebar{ width:200px; }
  }
  @media (max-width: 480px){
    .rt-wrap{ flex-direction:column; }
    .rt-sidebar{ width:100%; max-height:420px; }
    .rt-center-list{ max-height:220px; }
    .rt-main{ max-height:none; }
  }
</style>

<div class="rt-wrap">
  <aside class="rt-sidebar">
    <div class="rt-sidebar-head">
      <h1>월간 보고서 자동화</h1>
      <div class="sub">센터별 청구·실적 자동계산</div>
      <div class="rt-sb-status" id="rt-sb-status"></div>
    </div>
    <div class="rt-search"><input id="side-search" placeholder="센터·월 검색"></div>
    <div class="rt-nav-item active" data-view="all" id="nav-all">전체 보기</div>
    <div class="rt-nav-item" data-view="backup" id="nav-backup">백업 / 복원</div>
    <div class="rt-center-list" id="side-centers"></div>
    <button class="rt-add-center-btn" id="btn-add-center">+ 센터 추가</button>
    <button class="rt-add-center-btn" id="btn-customize" style="margin-top:-8px;">+ 커스터마이징</button>
  </aside>
  <main class="rt-main" id="rt-main"></main>
</div>

<div class="rt-toast" id="rt-toast"></div>
<div id="rt-modal-root"></div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => (n===null||n===undefined||n===''||isNaN(n)) ? '-' : Number(n).toLocaleString('ko-KR');
  const fmt1 = (n) => (n===null||n===undefined||n===''||isNaN(n)) ? '-' : Number(n).toFixed(1);
  const uid = () => 'c_' + Math.random().toString(36).slice(2,10);

  function toast(msg){
    const t = $('rt-toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1800);
  }

  function prevMonth(ym){
    const [y,m] = ym.split('-').map(Number);
    const d = new Date(y, m-2, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  function monthLabel(ym){ const [y,m]=ym.split('-'); return `${y}년 ${Number(m)}월`; }
  function lastDay(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
  function round10(supply){ return Math.round((supply||0) * 0.1); }

  // ---------- 공휴일 / 지급일 자동계산 ----------
  const KR_HOLIDAYS_2026 = [
    '2026-01-01', // 신정
    '2026-02-16','2026-02-17','2026-02-18', // 설날 연휴
    '2026-03-01','2026-03-02', // 삼일절 + 대체공휴일
    '2026-05-01', // 노동절
    '2026-05-05', // 어린이날
    '2026-05-24','2026-05-25', // 부처님오신날 + 대체공휴일
    '2026-06-03', // 지방선거(임시공휴일)
    '2026-06-06', // 현충일
    '2026-07-17', // 제헌절
    '2026-08-15','2026-08-17', // 광복절 + 대체공휴일
    '2026-09-24','2026-09-25','2026-09-26', // 추석 연휴
    '2026-10-03','2026-10-05', // 개천절 + 대체공휴일
    '2026-10-09', // 한글날
    '2026-12-25', // 성탄절
  ];
  function isHoliday(dateObj){
    const dow = dateObj.getDay(); // 0=일,6=토
    if(dow===0 || dow===6) return true;
    const ds = `${dateObj.getFullYear()}-${String(dateObj.getMonth()+1).padStart(2,'0')}-${String(dateObj.getDate()).padStart(2,'0')}`;
    return KR_HOLIDAYS_2026.includes(ds);
  }
  // 매월 지정일(기본 10일)이 공휴일/주말이면 하루씩 앞으로 당겨 영업일을 반환
  function computePayDate(ym, targetDay){
    const [y,m] = ym.split('-').map(Number);
    let d = new Date(y, m-1, targetDay||10);
    while(isHoliday(d)){
      d.setDate(d.getDate()-1);
    }
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function lgPeriodText(ym){
    const [y,m] = ym.split('-').map(Number);
    const pd = new Date(y, m-2, 20);
    return `${pd.getFullYear()}. ${pd.getMonth()+1}. 20. ~ ${y}. ${m}. 19.`;
  }
  function periodText(center, ym){
    if(center.type==='billing' && center.config.periodRule==='prev20cur19') return lgPeriodText(ym);
    const [y,m] = ym.split('-').map(Number);
    return `${y}. ${m}. 1. ~ ${y}. ${m}. ${lastDay(ym)}.`;
  }

  // ---------- 범용 주기(월/분기/반기/연간) 유틸 ----------
  function defaultPeriodId(periodType){
    const now = new Date();
    const y = now.getFullYear();
    if(periodType==='quarter') return `${y}-Q${Math.floor(now.getMonth()/3)+1}`;
    if(periodType==='half') return `${y}-H${now.getMonth()<6?1:2}`;
    if(periodType==='year') return `${y}`;
    return `${y}-${String(now.getMonth()+1).padStart(2,'0')}`; // month
  }
  function periodShift(periodType, id, delta){
    if(periodType==='quarter'){
      let [y,q] = id.split('-Q').map(Number);
      q += delta; while(q<1){q+=4;y--;} while(q>4){q-=4;y++;}
      return `${y}-Q${q}`;
    }
    if(periodType==='half'){
      let [y,h] = id.split('-H').map(Number);
      h += delta; while(h<1){h+=2;y--;} while(h>2){h-=2;y++;}
      return `${y}-H${h}`;
    }
    if(periodType==='year') return String(Number(id)+delta);
    const [y,m] = id.split('-').map(Number);
    const d = new Date(y, m-1+delta, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  function periodLabel(periodType, id){
    if(periodType==='quarter'){ const [y,q]=id.split('-Q'); return `${y}년 ${q}분기`; }
    if(periodType==='half'){ const [y,h]=id.split('-H'); return `${y}년 ${h==='1'?'상반기':'하반기'}`; }
    if(periodType==='year') return `${id}년`;
    return monthLabel(id);
  }
  function periodDateRangeText(periodType, id){
    if(periodType==='quarter'){
      const [y,q] = id.split('-Q').map(Number);
      const startM = (q-1)*3;
      const start = new Date(y, startM, 1), end = new Date(y, startM+3, 0);
      return `${y}. ${startM+1}. 1. ~ ${y}. ${end.getMonth()+1}. ${end.getDate()}. (${y}년 ${q}분기)`;
    }
    if(periodType==='half'){
      const [y,h] = id.split('-H').map(Number);
      const startM = h===1?0:6;
      const end = new Date(y, startM+6, 0);
      return `${y}. ${startM+1}. 1. ~ ${y}. ${end.getMonth()+1}. ${end.getDate()}. (${y}년 ${h===1?'상반기':'하반기'})`;
    }
    if(periodType==='year'){
      return `${id}. 1. 1. ~ ${id}. 12. 31.`;
    }
    const [y,m] = id.split('-').map(Number);
    return `${y}. ${m}. 1. ~ ${y}. ${m}. ${lastDay(id)}.`;
  }
  function arrowSpan(diff, unit, decimals){
    if(diff===null||diff===undefined||isNaN(diff)) return '<span class="rt-arrow-flat">-</span>';
    const val = decimals ? Math.abs(diff).toFixed(decimals) : fmt(Math.abs(diff));
    if(diff>0) return `<span class="rt-arrow-up">▲ ${val}${unit}</span>`;
    if(diff<0) return `<span class="rt-arrow-down">▼ ${val}${unit}</span>`;
    return `<span class="rt-arrow-flat">- (동일)</span>`;
  }
  function signedFmt(diff){
    if(diff===null||diff===undefined||isNaN(diff)) return '-';
    if(diff===0) return '-';
    return (diff>0?'+':'') + fmt(diff);
  }

  function copyHtml(el){
    const html = el.innerHTML, text = el.innerText;
    try{
      const item = new ClipboardItem({'text/html': new Blob([html],{type:'text/html'}), 'text/plain': new Blob([text],{type:'text/plain'})});
      navigator.clipboard.write([item]).then(()=>toast('표를 복사했습니다.'));
    }catch(e){
      const range = document.createRange(); range.selectNode(el);
      window.getSelection().removeAllRanges(); window.getSelection().addRange(range);
      try{ document.execCommand('copy'); toast('표를 복사했습니다.'); }catch(e2){ toast('복사 실패 - 직접 드래그해서 복사해주세요.'); }
      window.getSelection().removeAllRanges();
    }
  }
  function copyText(text){
    navigator.clipboard.writeText(text).then(()=>toast('복사했습니다.')).catch(()=>toast('복사 실패'));
  }

  // ---------- Supabase / 저장소 어댑터 ----------
  const SB_URL = 'https://zbiwyqwjehnogxkzlhxx.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaXd5cXdqZWhub2d4a3psaHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwOTQ1MzYsImV4cCI6MjA5NjY3MDUzNn0.SQJjHnDcMTRyElxtY9E-04yIkzPVF35L8hcx0lSyG48';
  const SB_ENABLED = SB_KEY && SB_KEY !== 'YOUR_SUPABASE_ANON_KEY';

  async function sbGet(key){
    const res = await fetch(`${SB_URL}/rest/v1/rpt_kv?key=eq.${encodeURIComponent(key)}&select=value`, { headers:{apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`} });
    if(!res.ok) throw new Error('sbGet '+res.status);
    const rows = await res.json();
    return rows.length ? rows[0].value : null;
  }
  async function sbSet(key, value){
    const res = await fetch(`${SB_URL}/rest/v1/rpt_kv`, {
      method:'POST',
      headers:{apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates'},
      body: JSON.stringify({key, value, updated_at:new Date().toISOString()})
    });
    if(!res.ok) throw new Error('sbSet '+res.status);
    return true;
  }
  async function sbDelete(key){
    const res = await fetch(`${SB_URL}/rest/v1/rpt_kv?key=eq.${encodeURIComponent(key)}`, { method:'DELETE', headers:{apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`} });
    return res.ok;
  }
  async function sbList(prefix){
    const res = await fetch(`${SB_URL}/rest/v1/rpt_kv?key=like.${encodeURIComponent(prefix+'*')}&select=key,value,updated_at&order=key.desc`, { headers:{apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`} });
    if(!res.ok) return [];
    return await res.json();
  }

  async function storageGet(key){
    try{
      if(SB_ENABLED) return await sbGet(key);
      const r = await window.storage.get(key);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  async function storageSet(key, obj){
    try{
      if(SB_ENABLED) return await sbSet(key, obj);
      await window.storage.set(key, JSON.stringify(obj));
      return true;
    }catch(e){ console.error(e); return false; }
  }
  async function storageDelete(key){
    try{
      if(SB_ENABLED) return await sbDelete(key);
      await window.storage.delete(key);
      return true;
    }catch(e){ return false; }
  }
  async function storageList(prefix){
    try{
      if(SB_ENABLED) return await sbList(prefix);
      const r = await window.storage.list(prefix);
      if(!r || !r.keys) return [];
      const out = [];
      for(const k of r.keys){ const v = await storageGet(k); if(v!==null) out.push({key:k, value:v}); }
      out.sort((a,b)=> a.key < b.key ? 1 : -1);
      return out;
    }catch(e){ console.error(e); return []; }
  }

  // ---------- AI 자동입력 (텍스트+이미지) ----------
  function fileToBase64(file){
    return new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }
  // AI 자동입력은 반드시 Supabase Edge Function을 통해서만 호출됩니다.
  // (claude.ai 미리보기 환경은 보안정책상 api.anthropic.com 직접 호출이 차단되어 있고,
  //  실제 배포 후에도 브라우저에 API 키를 노출하지 않기 위해 서버 프록시가 필요합니다.)
  const AI_PROXY_URL = `${SB_URL}/functions/v1/rpt-ai-parse`;

  async function callClaudeAPI(system, content){
    if(!SB_ENABLED){
      throw new Error('AI 자동입력은 Supabase 배포 후에만 사용할 수 있습니다. (SB_KEY 미설정 — 로컬 모드에서는 직접 입력해주세요)');
    }
    const resp = await fetch(AI_PROXY_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json', apikey: SB_KEY, Authorization:`Bearer ${SB_KEY}`},
      body: JSON.stringify({ system, content })
    });
    let data;
    try{ data = await resp.json(); }catch(e){ throw new Error(`서버 응답을 읽지 못했습니다 (status ${resp.status})`); }
    if(!resp.ok || data.type==='error' || (data.error)){
      const msg = (data.error && data.error.message) ? data.error.message : `API 오류 (status ${resp.status})`;
      throw new Error(msg);
    }
    return data;
  }

  async function aiAutoFill(fieldsSpec, text, imageFiles){
    const fieldDesc = fieldsSpec.map(f=>`- ${f.id}: ${f.label} (숫자만 반환, 콤마·단위·% 기호 제거)`).join('\n');
    const system = `당신은 표/문서 이미지 또는 텍스트에서 실적·청구 데이터를 추출하는 도우미입니다.
아래 필드에 해당하는 "당월" 수치를 찾아 JSON 객체 하나만 출력하세요. 설명, 코드블록 표시 없이 순수 JSON만 출력합니다.
${fieldDesc}
확실하지 않으면 해당 필드는 null로 표기하세요.`;
    const content = [];
    if(imageFiles && imageFiles.length){
      for(const f of imageFiles){
        const b64 = await fileToBase64(f);
        content.push({type:'image', source:{type:'base64', media_type: f.type || 'image/png', data:b64}});
      }
    }
    content.push({type:'text', text: text && text.trim() ? text : '위 이미지(들)의 표 내용을 분석해줘.'});

    let lastErr;
    for(let attempt=0; attempt<2; attempt++){
      try{
        const data = await callClaudeAPI(system, content);
        const textBlock = (data.content||[]).find(b=>b.type==='text');
        if(!textBlock) throw new Error('빈 응답 (다시 시도해주세요)');
        const clean = textBlock.text.replace(/```json|```/g,'').trim();
        return JSON.parse(clean);
      }catch(e){
        lastErr = e;
        if(attempt===0){ await new Promise(r=>setTimeout(r,1200)); continue; } // 1회 자동 재시도
      }
    }
    throw lastErr;
  }

      const ym = item.key.split('__').pop();
      let summary = center.type==='perf'
        ? `인입 ${fmt(item.value.inbound)}건 · 응대율 ${fmt1(item.value.rate)}%`
        : `공급가액 합계 ${fmt((item.value.supplies||[]).reduce((a,b)=>a+(b||0),0))}원`;
      rows.push({ centerId:center.id, centerName:center.name, module:inputTabLabel(center), sub:'input', ym, periodDisplay:monthLabel(ym), summary, updatedAt:item.value.savedAt||item.updated_at||ym, raw:item.value });
    });
    bonusHist.forEach(item=>{
      const parts = item.key.split('__'); const ym = parts.pop(); const typeId = parts.pop();
      const pt = (center.payoutTypes||[]).find(p=>p.id===typeId);
      rows.push({ centerId:center.id, centerName:center.name, module: pt?pt.label:'성과급', sub:`bonus:${typeId}`, ym, periodDisplay:monthLabel(ym), summary:`${fmt(item.value.amount)}원 · 지급일 ${item.value.paydate||'-'}`, updatedAt:item.value.savedAt||item.updated_at||ym, raw:item.value });
    });
    weeklyHist.forEach(item=>{
      const ym = item.key.split('__').pop();
      const rowsData = item.value.rows||[];
      rows.push({ centerId:center.id, centerName:center.name, module:(center.weeklyCheckConfig&&center.weeklyCheckConfig.tabLabel)||'점검입력', sub:'weekly', ym, periodDisplay:monthLabel(ym), summary:`점검 ${rowsData.length}회 · 취약인원 합계 ${rowsData.reduce((a,r)=>a+(Number(r.vuln)||0),0)}명`, updatedAt:item.value.savedAt||item.updated_at||ym, raw:item.value });
    });
    reportHist.forEach(item=>{
      const parts = item.key.split('__'); const ym = parts.pop(); const kindId = parts.pop();
      const kind = (center.simpleReportConfig&&center.simpleReportConfig.kinds||[]).find(k=>k.id===kindId);
      const pType = kind ? (kind.periodType||'month') : 'month';
      rows.push({ centerId:center.id, centerName:center.name, module: kind?(kind.tabLabel||kind.label):'보고', sub:`report:${kindId}`, ym, periodDisplay:periodLabel(pType, ym), summary:(item.value.result||'-'), updatedAt:item.value.savedAt||item.updated_at||ym, raw:item.value });
    });
    eventHist.forEach(item=>{
      const parts = item.key.split('__'); const entryId = parts.pop(); const kindId = parts.pop();
      const kind = (center.eventLogConfig&&center.eventLogConfig.kinds||[]).find(k=>k.id===kindId);
      const d = item.value.entryDate || (item.value.savedAt||'').slice(0,10);
      let summary = kind && kind.hasRows ? `${(item.value.rows||[]).length}명` : (kind ? (item.value[kind.fields[0].id]||'-') : '-');
      rows.push({ centerId:center.id, centerName:center.name, module: kind?(kind.tabLabel||kind.label):'로그', sub:`eventlog:${kindId}`, ym:entryId, periodDisplay:d||'-', summary, updatedAt:item.value.savedAt||item.updated_at||d, raw:item.value });
    });
    return rows;
  }

  function routeToHistoryRow(r){
    const center = getCenter(r.centerId);
    if(!center) return;
    if(r.sub==='input'){ inputMonth = {centerId:center.id, ym:r.ym}; }
    else if(r.sub.startsWith('bonus:')){ bonusMonth = {centerId:center.id, ym:r.ym, payoutTypeId:r.sub.slice(6)}; }
    else if(r.sub==='weekly'){ weeklyMonth = {centerId:center.id, ym:r.ym}; }
    else if(r.sub.startsWith('report:')){ reportMonth = {centerId:center.id, ym:r.ym, kindId:r.sub.slice(7)}; }
    else if(r.sub.startsWith('eventlog:')){ eventLogState = {centerId:center.id, kindId:r.sub.slice(9), entryId:r.ym}; }
    currentView = { type:'center', id:center.id, sub:r.sub };
  }
  async function deleteHistoryRow(r){
    const center = getCenter(r.centerId);
    if(!center) return;
    if(r.sub==='input') await storageDelete(`rec__${center.id}__${r.ym}`);
    else if(r.sub.startsWith('bonus:')) await storageDelete(`bonus__${center.id}__${r.sub.slice(6)}__${r.ym}`);
    else if(r.sub==='weekly') await storageDelete(`weekly__${center.id}__${r.ym}`);
    else if(r.sub.startsWith('report:')) await storageDelete(`report__${center.id}__${r.sub.slice(7)}__${r.ym}`);
    else if(r.sub.startsWith('eventlog:')) await storageDelete(`eventlog__${center.id}__${r.sub.slice(9)}__${r.ym}`);
  }

  let allViewPage = 0;
  async function renderAllView(){
    const main = $('rt-main');
    main.innerHTML = `<div class="rt-main-header"><div><h2>전체 보기</h2><div class="desc">전체 센터의 모든 이력을 저장된 순서(최신순)로 모아봅니다.</div></div></div>
      <div id="all-recent"></div>
      <div class="rt-actions" id="all-pager" style="justify-content:center;"></div>`;

    let rows = [];
    for(const c of centers){
      rows = rows.concat(await collectCenterHistoryRows(c));
    }

    const q = searchQuery.trim().toLowerCase();
    if(q){
      rows = rows.filter(r=> JSON.stringify(r.raw).toLowerCase().includes(q) || r.ym.includes(q) || r.module.toLowerCase().includes(q) || r.centerName.toLowerCase().includes(q) || (r.periodDisplay||"").toLowerCase().includes(q));
    }
    rows.sort((a,b)=> (a.updatedAt < b.updatedAt ? 1 : -1));

    const pageSize = 10;
    const totalPages = Math.max(1, Math.ceil(rows.length/pageSize));
    if(allViewPage >= totalPages) allViewPage = totalPages-1;
    if(allViewPage < 0) allViewPage = 0;
    const pageRows = rows.slice(allViewPage*pageSize, allViewPage*pageSize+pageSize);

    $('all-recent').innerHTML = pageRows.length ? pageRows.map((r,i)=>`
      <div class="rt-history-row" data-i="${i}">
        <div class="info"><b>${r.centerName}</b> · <span style="color:var(--kt-gray);font-weight:700;">${r.module}</span> · ${r.periodDisplay} · ${r.summary}</div>
        <div class="ops">

          <button class="rt-btn rt-btn-danger rt-btn-sm" data-del-i="${i}">삭제</button>
        </div>
      </div>`).join('') : `<div class="rt-empty">${q?'검색 결과가 없습니다.':'저장된 기록이 없습니다.'}</div>`;

    $('all-pager').innerHTML = totalPages>1 ? `
      <button class="rt-btn rt-btn-ghost rt-btn-sm" id="all-prev" ${allViewPage===0?'disabled':''}>◀ 이전</button>
      <span style="font-size:12px;color:var(--sub);align-self:center;">${allViewPage+1} / ${totalPages} 페이지 (총 ${rows.length}건)</span>
      <button class="rt-btn rt-btn-ghost rt-btn-sm" id="all-next" ${allViewPage>=totalPages-1?'disabled':''}>다음 ▶</button>
    ` : (rows.length ? `<span style="font-size:12px;color:var(--sub);">총 ${rows.length}건</span>` : '');

    const prevBtn = $('all-prev'), nextBtn = $('all-next');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ allViewPage--; renderAllView(); });
    if(nextBtn) nextBtn.addEventListener('click', ()=>{ allViewPage++; renderAllView(); });

    $('all-recent').querySelectorAll('[data-edit-i]').forEach(b=>{
      b.addEventListener('click', ()=>{ routeToHistoryRow(pageRows[Number(b.dataset.editI)]); renderAll(); });
    });
    $('all-recent').querySelectorAll('[data-del-i]').forEach(b=>{

        renderAllView();
      });
    });
  }

  async function collectAllData(){
    const recRecords = await storageList('rec__');
    const bonusRecords = await storageList('bonus__');
    const data = { version:1, exportedAt:new Date().toISOString(), centers, records:{}, bonusRecords:{} };
    recRecords.forEach(item=>{ data.records[item.key] = item.value; });
    bonusRecords.forEach(item=>{ data.bonusRecords[item.key] = item.value; });
    return data;
  }

  async function restoreFromData(data){
    if(!data || !Array.isArray(data.centers)){
      toast('올바른 백업 파일이 아닙니다.');
      return false;
    }
    const recCount = data.records ? Object.keys(data.records).length : 0;
    const bonusCount = data.bonusRecords ? Object.keys(data.bonusRecords).length : 0;
    const ok = confirm(`센터 ${data.centers.length}개, 월별 기록 ${recCount}건, 성과급 기록 ${bonusCount}건을 복원합니다.\n현재 저장된 데이터는 이 백업 내용으로 덮어써집니다. 계속하시겠습니까?`);
    if(!ok) return false;
    await storageSet('centers', data.centers);
    if(data.records){
      for(const key of Object.keys(data.records)){ await storageSet(key, data.records[key]); }
    }
    if(data.bonusRecords){
      for(const key of Object.keys(data.bonusRecords)){ await storageSet(key, data.bonusRecords[key]); }
    }
    await loadCenters();
    toast('복원이 완료되었습니다.');
    currentView = {type:'all'};
    await renderAll();
    return true;
  }

  function downloadJSON(obj, filename){
    const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ============================================================
  // 센터 상세 뷰
  // ============================================================
  function inputTabLabel(center){
    return center.customInputLabel || (center.type==='billing' ? '수수료청구' : '입력');
  }

  // 센터의 모든 관리 가능한 탭 목록 (전체이력 제외) — 탭관리/이름변경에서 공용으로 사용
  function getAllTabDefs(center){
    const defs = [ { key:'input', label:inputTabLabel(center), hidden:!!center.inputHidden, deletable:false } ];
    (center.payoutTypes||[]).forEach(pt=>{ defs.push({ key:`bonus:${pt.id}`, label:pt.label, hidden:!!pt.hidden, deletable:true }); });
    if(center.weeklyCheckEnabled){
      defs.push({ key:'weekly', label:(center.weeklyCheckConfig&&center.weeklyCheckConfig.tabLabel)||'점검입력', hidden:!!center.weeklyHidden, deletable:true });
    }
    if(center.simpleReportEnabled){
      ((center.simpleReportConfig&&center.simpleReportConfig.kinds)||[]).forEach(k=>{ defs.push({ key:`report:${k.id}`, label:k.tabLabel||k.label, hidden:!!k.hidden, deletable:true }); });
    }
    if(center.eventLogEnabled){
      ((center.eventLogConfig&&center.eventLogConfig.kinds)||[]).forEach(k=>{ defs.push({ key:`eventlog:${k.id}`, label:k.tabLabel||k.label, hidden:!!k.hidden, deletable:true }); });
    }
    return defs;
  }
  function renameTab(center, subKey, newLabel){
    if(!newLabel || !newLabel.trim()) return;
    newLabel = newLabel.trim();
    if(subKey==='input') center.customInputLabel = newLabel;
    else if(subKey.startsWith('bonus:')){ const pt=(center.payoutTypes||[]).find(p=>p.id===subKey.slice(6)); if(pt) pt.label=newLabel; }
    else if(subKey==='weekly'){ center.weeklyCheckConfig = center.weeklyCheckConfig||{}; center.weeklyCheckConfig.tabLabel=newLabel; }
    else if(subKey.startsWith('report:')){ const k=(center.simpleReportConfig&&center.simpleReportConfig.kinds||[]).find(x=>x.id===subKey.slice(7)); if(k) k.tabLabel=newLabel; }
    else if(subKey.startsWith('eventlog:')){ const k=(center.eventLogConfig&&center.eventLogConfig.kinds||[]).find(x=>x.id===subKey.slice(9)); if(k) k.tabLabel=newLabel; }
  }
  function setTabHidden(center, subKey, hidden){
    if(subKey==='input') center.inputHidden = hidden;
    else if(subKey.startsWith('bonus:')){ const pt=(center.payoutTypes||[]).find(p=>p.id===subKey.slice(6)); if(pt) pt.hidden=hidden; }
    else if(subKey==='weekly'){ center.weeklyHidden = hidden; }
    else if(subKey.startsWith('report:')){ const k=(center.simpleReportConfig&&center.simpleReportConfig.kinds||[]).find(x=>x.id===subKey.slice(7)); if(k) k.hidden=hidden; }
    else if(subKey.startsWith('eventlog:')){ const k=(center.eventLogConfig&&center.eventLogConfig.kinds||[]).find(x=>x.id===subKey.slice(9)); if(k) k.hidden=hidden; }
  }
  function deleteTabDef(center, subKey){
    if(subKey.startsWith('bonus:')){ center.payoutTypes = (center.payoutTypes||[]).filter(p=>p.id!==subKey.slice(6)); }
    else if(subKey==='weekly'){ center.weeklyCheckEnabled = false; }
    else if(subKey.startsWith('report:')){ if(center.simpleReportConfig) center.simpleReportConfig.kinds = (center.simpleReportConfig.kinds||[]).filter(k=>k.id!==subKey.slice(7)); }
    else if(subKey.startsWith('eventlog:')){ if(center.eventLogConfig) center.eventLogConfig.kinds = (center.eventLogConfig.kinds||[]).filter(k=>k.id!==subKey.slice(9)); }
  }

                </div>
              </div>`).join('') || `<div class="rt-empty">표시 중인 탭이 없습니다.</div>`}

            <button type="button" class="rt-btn rt-btn-ghost rt-btn-sm" id="tabmgr-toggle-hidden" style="margin-top:10px;">숨긴 항목 보기 (${hidden.length})</button>
            <div id="tabmgr-hidden-list" style="display:${showHidden?'':'none'}; margin-top:8px;">
              ${hidden.map(d=>`
                <div class="rt-history-row">
                  <div class="info">${d.label} <span style="color:var(--sub);">(숨김)</span></div>
                  <div class="ops"><label style="font-size:12px;display:flex;align-items:center;gap:4px;"><input type="checkbox" class="tabmgr-unhide" data-key="${d.key}" checked> 숨김 해제</label></div>
                </div>`).join('') || `<div class="rt-empty">숨긴 탭이 없습니다.</div>`}
            </div>

            <div class="rt-actions">
              <button class="rt-btn rt-btn-ghost" id="tabmgr-close">닫기</button>
            </div>
          </div>
        </div>`;

      $('tabmgr-toggle-hidden').addEventListener('click', ()=>{ showHidden = !showHidden; render(); });
      $('tabmgr-close').addEventListener('click', async ()=>{ root.innerHTML=''; await saveCenters(); renderAll(); });
      root.querySelectorAll('.tabmgr-hide').forEach(cb=>{
        cb.addEventListener('change', ()=>{ setTabHidden(center, cb.dataset.key, cb.checked); render(); });
      });
      root.querySelectorAll('.tabmgr-del').forEach(b=>{
        b.addEventListener('click', ()=>{
          if(!confirm('이 탭을 삭제할까요? 이전에 저장된 데이터는 남아있지만 탭 목록에서 완전히 제거됩니다.')) return;
          deleteTabDef(center, b.dataset.key);
          render();
        });
      });
      root.querySelectorAll('.tabmgr-unhide').forEach(cb=>{
        cb.addEventListener('change', ()=>{ if(!cb.checked) setTabHidden(center, cb.dataset.key, false); render(); });
      });
      $('tabmgr-bg').addEventListener('click', async (e)=>{ if(e.target.id==='tabmgr-bg'){ root.innerHTML=''; await saveCenters(); renderAll(); } });

    render();

  async function renderCenterView(){
    const center = getCenter(currentView.id);
    if(!center){ currentView = {type:'all'}; return renderAll(); }
    const main = $('rt-main');
    const allDefs = getAllTabDefs(center);
    const subtabs = [['allhistory','전체이력']].concat(allDefs.filter(d=>!d.hidden).map(d=>[d.key, d.label]));
    if(!currentView.sub) currentView.sub = 'input';
    if(currentView.sub!=='allhistory' && !subtabs.find(([k])=>k===currentView.sub)) currentView.sub = 'input';
    main.innerHTML = `
      <div class="rt-main-header">
        <div><h2>${center.name}</h2><div class="desc">${TYPE_LABEL[center.type]}${center.type==='billing'?' · '+center.config.rowLabels.join(' / '):''}</div></div>
        <div class="rt-actions" style="margin-top:0;">
          <button class="rt-btn rt-btn-ghost rt-btn-sm" id="btn-manage-tabs">탭 관리</button>
          <button class="rt-btn rt-btn-ghost rt-btn-sm" id="btn-edit-center">센터 설정</button>
          <button class="rt-btn rt-btn-danger rt-btn-sm" id="btn-delete-center">센터 삭제</button>
        </div>
      </div>
      <div class="rt-subtabs">${subtabs.map(([k,l])=>`<div class="rt-subtab ${currentView.sub===k?'active':''}" data-sub="${k}" title="더블클릭하면 이름을 수정할 수 있습니다">${l}</div>`).join('')}</div>
      <div id="center-sub-content"></div>
    `;
    main.querySelectorAll('.rt-subtab').forEach(el=>{
      el.addEventListener('click', ()=>{ currentView.sub = el.dataset.sub; renderAll(); });
      if(el.dataset.sub!=='allhistory'){
        el.addEventListener('dblclick', (e)=>{
          e.stopPropagation();
          const subKey = el.dataset.sub;
          const currentLabel = el.textContent;
          const input = document.createElement('input');
          input.type = 'text';
          input.value = currentLabel;
          input.style.cssText = 'font-size:12.8px;font-weight:700;width:100%;border:1px solid var(--kt-red);border-radius:3px;padding:2px 4px;';
          el.textContent = '';
          el.appendChild(input);
          input.focus();
          input.select();
          const commit = async ()=>{
            renameTab(center, subKey, input.value);
            await saveCenters();
            renderAll();
          };
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', (ev)=>{
            if(ev.key==='Enter'){ ev.preventDefault(); input.blur(); }
            if(ev.key==='Escape'){ ev.preventDefault(); input.removeEventListener('blur', commit); renderAll(); }
          });
        });
      }
    });
    $('btn-manage-tabs').addEventListener('click', ()=>openTabManageModal(center));
    $('btn-edit-center').addEventListener('click', ()=>openCenterModal(center));
    $('btn-delete-center').addEventListener('click', async ()=>{
      if(!confirm(`'${center.name}' 센터를 삭제할까요? 저장된 기록은 남아있지만 목록에서 사라집니다.`)) return;
      centers = centers.filter(c=>c.id!==center.id);
      await saveCenters();
      currentView = {type:'all'};
      renderAll();
    });

    if(currentView.sub==='allhistory') await renderCenterAllHistory(center);
    else if(currentView.sub==='input') await renderCenterInput(center);
    else if(currentView.sub.startsWith('bonus:')) await renderCenterBonus(center, currentView.sub.slice(6));
    else if(currentView.sub==='weekly') await renderCenterWeeklyCheck(center);
    else if(currentView.sub.startsWith('report:')) await renderCenterSimpleReport(center, currentView.sub.slice(7));
    else if(currentView.sub.startsWith('eventlog:')) await renderCenterEventLog(center, currentView.sub.slice(9));
  }

  // ---------- 전체이력 탭 (모든 모듈 통합, 10개씩 페이지네이션) ----------
  let allHistoryPage = 0;
  async function renderCenterAllHistory(center){
    const container = $('center-sub-content');
    container.innerHTML = `<div id="allhist-list"></div><div class="rt-actions" id="allhist-pager" style="justify-content:center;"></div>`;

    let rows = await collectCenterHistoryRows(center);

    const q = searchQuery.trim().toLowerCase();
    if(q){
      rows = rows.filter(r=> JSON.stringify(r.raw).toLowerCase().includes(q) || r.ym.includes(q) || r.module.toLowerCase().includes(q) || (r.periodDisplay||"").toLowerCase().includes(q));
    }
    rows.sort((a,b)=> (a.updatedAt < b.updatedAt ? 1 : -1));

    const pageSize = 10;
    const totalPages = Math.max(1, Math.ceil(rows.length/pageSize));
    if(allHistoryPage >= totalPages) allHistoryPage = totalPages-1;
    if(allHistoryPage < 0) allHistoryPage = 0;
    const pageRows = rows.slice(allHistoryPage*pageSize, allHistoryPage*pageSize+pageSize);

    $('allhist-list').innerHTML = pageRows.length ? pageRows.map((r,i)=>`
      <div class="rt-history-row">
        <div class="info"><b>${r.periodDisplay}</b> · <span style="color:var(--kt-gray);font-weight:700;">${r.module}</span> · ${r.summary}</div>
        <div class="ops">
          <button class="rt-btn rt-btn-ghost rt-btn-sm" data-edit-i="${i}">수정</button>
          <button class="rt-btn rt-btn-danger rt-btn-sm" data-del-i="${i}">삭제</button>
        </div>
      </div>`).join('') : `<div class="rt-empty">${q?'검색 결과가 없습니다.':'저장된 기록이 없습니다.'}</div>`;

    $('allhist-pager').innerHTML = totalPages>1 ? `
      <button class="rt-btn rt-btn-ghost rt-btn-sm" id="allhist-prev" ${allHistoryPage===0?'disabled':''}>◀ 이전</button>
      <span style="font-size:12px;color:var(--sub);align-self:center;">${allHistoryPage+1} / ${totalPages} 페이지 (총 ${rows.length}건)</span>
      <button class="rt-btn rt-btn-ghost rt-btn-sm" id="allhist-next" ${allHistoryPage>=totalPages-1?'disabled':''}>다음 ▶</button>
    ` : (rows.length ? `<span style="font-size:12px;color:var(--sub);">총 ${rows.length}건</span>` : '');

    const prevBtn = $('allhist-prev'), nextBtn = $('allhist-next');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{ allHistoryPage--; renderCenterAllHistory(center); });
    if(nextBtn) nextBtn.addEventListener('click', ()=>{ allHistoryPage++; renderCenterAllHistory(center); });

    container.querySelectorAll('[data-edit-i]').forEach(b=>{
      b.addEventListener('click', ()=>{ routeToHistoryRow(pageRows[Number(b.dataset.editI)]); renderAll(); });
    });
    container.querySelectorAll('[data-del-i]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        const r = pageRows[Number(b.dataset.delI)];
        if(!confirm(`${r.periodDisplay} 기록을 삭제할까요?`)) return;
        await deleteHistoryRow(r);
        toast('삭제했습니다.');
        renderCenterAllHistory(center);
      });
    });
  }

  // ---------- 입력 탭 ----------
  let inputMonth = null; // {centerId: ym}
  async function renderCenterInput(center){
    const container = $('center-sub-content');
    const ym = (inputMonth && inputMonth.centerId===center.id) ? inputMonth.ym : (new Date().toISOString().slice(0,7));
    inputMonth = { centerId: center.id, ym };

    container.innerHTML = `
      <div class="rt-row">
        <div class="rt-field" style="max-width:240px;"><label>기준월</label>
          <div style="display:flex;gap:4px;align-items:center;">
            <button type="button" class="rt-btn rt-btn-ghost rt-btn-sm" id="in-month-prev" style="padding:8px 10px;" title="이전 달">◀</button>
            <input type="month" id="in-month" value="${ym}" style="flex:1;">
            <button type="button" class="rt-btn rt-btn-ghost rt-btn-sm" id="in-month-next" style="padding:8px 10px;" title="다음 달">▶</button>
          </div>
        </div>
        ${center.type==='billing' ? `<div class="rt-field" style="max-width:200px;"><label>세금계산서 발행일</label><input type="date" id="in-taxdate"></div>` : ''}
        <div class="rt-field" style="flex:2;"><div class="rt-status" id="in-status">-</div></div>
      </div>
      <div class="rt-hint" id="in-period"></div>

      <div class="rt-ai-box">
        <div style="font-weight:700;font-size:12.6px;color:var(--kt-black);margin-bottom:8px;">빠른 입력 — 표 붙여넣기 또는 캡처 이미지 첨부</div>
        <div class="rt-row">
          <div class="rt-field" style="flex:2;"><textarea id="ai-paste" class="rt-comment" placeholder="표를 복사해서 붙여넣으세요 (선택)"></textarea></div>
          <div class="rt-field" style="max-width:220px;">
            <label>캡처 이미지 (선택, 여러장 가능)</label>

          </div>
        </div>
        <button class="rt-btn rt-btn-primary" id="ai-fill-btn">자동 반영</button>
        <div class="rt-hint">텍스트·이미지 중 하나만 있어도 되고, 둘 다 첨부하면 함께 분석합니다.</div>
      </div>

      <div id="tpl-form"></div>

      <div class="rt-actions">
        <button class="rt-btn rt-btn-primary" id="btn-save-record">이번 달 저장</button>
        <button class="rt-btn rt-btn-ghost" id="btn-copy-preview">전체 복사</button>
        <button class="rt-btn rt-danger rt-btn-danger" id="btn-delete-record" style="display:none;">이 달 기록 삭제</button>
      </div>
      <div class="rt-section-title">복사용 미리보기</div>
      <div class="rt-copy-target" id="tpl-preview"></div>
    `;

    if($('in-taxdate')) $('in-taxdate').value = new Date().toISOString().slice(0,10);
    $('tpl-form').addEventListener('input', ()=>{ formDirty = true; });
    async function goToMonth(newYm){
      if(formDirty){ snapshotCurrentForm(); }
      inputMonth.ym = newYm;
      $('in-month').value = newYm;
      await loadAndRenderTemplate(center);
    }
    function shiftMonth(ym, delta){
      const [y,m] = ym.split('-').map(Number);
      const d = new Date(y, m-1+delta, 1);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    }
    $('in-month').addEventListener('change', async ()=>{ await goToMonth($('in-month').value); });
    $('in-month-prev').addEventListener('click', async ()=>{ await goToMonth(shiftMonth(inputMonth.ym, -1)); });
    $('in-month-next').addEventListener('click', async ()=>{ await goToMonth(shiftMonth(inputMonth.ym, 1)); });
    $('ai-fill-btn').addEventListener('click', ()=>runAiFill(center));
    $('btn-copy-preview').addEventListener('click', ()=>copyHtml($('tpl-preview')));
    $('tpl-preview').addEventListener('click', (e)=>{
      const btn = e.target.closest('.rt-mini-copy-btn');
      if(!btn) return;
      const section = btn.closest('.rt-copy-section');
      const table = section ? section.querySelector('table') : null;
      if(table) copyHtml(table);
    });
    $('btn-save-record').addEventListener('click', ()=>saveRecord(center));
    $('btn-delete-record').addEventListener('click', ()=>deleteRecord(center));

    await loadAndRenderTemplate(center);
  }

  let currentRecord = null, currentPrevRecord = null;
  const draftCache = {}; // 세션 임시 저장 (저장 전 입력값 유지) — 새로고침 시에는 사라짐
  let formDirty = false; // 렌더 이후 사용자가 실제로 값을 바꿨는지 추적

  function draftKey(){ return `${inputMonth.centerId}|${inputMonth.ym}`; }

  // 현재 입력 폼의 모든 값을 draft로 스냅샷 (다른 달로 이동하기 직전에 호출)
  function snapshotCurrentForm(){
    if(!inputMonth || !inputMonth.centerId) return;
    const fields = {};
    document.querySelectorAll('#tpl-form input, #tpl-form textarea').forEach(el=>{
      const sel = el.id || `${el.className}::${el.dataset.id||el.dataset.idx||''}`;
      fields[sel] = el.value;
    });
    if($('in-taxdate')) fields['in-taxdate'] = $('in-taxdate').value;
    const commentEl = document.querySelector('#bill-comment');
    draftCache[draftKey()] = { fields, commentUserEdited: commentEl ? commentEl.dataset.userEdited : undefined };
  }

  // draft가 있으면 폼 렌더 직후 값 복원 (저장 안 한 입력 유지)
  function restoreDraftForm(){
    const draft = draftCache[draftKey()];
    if(!draft) return false;
    document.querySelectorAll('#tpl-form input, #tpl-form textarea').forEach(el=>{
      const sel = el.id || `${el.className}::${el.dataset.id||el.dataset.idx||''}`;
      if(draft.fields[sel] !== undefined) el.value = draft.fields[sel];
    });
    if($('in-taxdate') && draft.fields['in-taxdate']!==undefined) $('in-taxdate').value = draft.fields['in-taxdate'];
    const commentEl = document.querySelector('#bill-comment');
    if(commentEl && draft.commentUserEdited) commentEl.dataset.userEdited = draft.commentUserEdited;
    return true;
  }

  // 정확히 "전월"에 저장된 기록이 없으면, 가장 최근에 저장된 이전 기록을 찾아 전월값 기준으로 사용
  async function findMostRecentPriorRecord(centerId, ym){
    const list = await storageList(`rec__${centerId}__`); // updated_at/key 기준 내림차순 정렬됨
    for(const item of list){
      const itemYm = item.key.split('__').pop();
      if(itemYm < ym) return { ym: itemYm, value: item.value };
    }
    return null;
  }

  async function loadAndRenderTemplate(center){
    formDirty = false;
    const ym = inputMonth.ym;
    $('in-period').textContent = `청구/보고 기간: ${periodText(center, ym)}`;
    currentRecord = await storageGet(`rec__${center.id}__${ym}`);
    const exactPm = prevMonth(ym);
    let prevSourceYm = null;
    const exactPrev = await storageGet(`rec__${center.id}__${exactPm}`);
    if(exactPrev){
      currentPrevRecord = exactPrev; prevSourceYm = exactPm;
    }else{
      const found = await findMostRecentPriorRecord(center.id, ym);
      currentPrevRecord = found ? found.value : null;
      prevSourceYm = found ? found.ym : null;
    }
    const st = $('in-status');
    const hasDraft = !!draftCache[draftKey()];
    if(hasDraft){ st.className='rt-status'; st.textContent = `${monthLabel(ym)} — 저장하지 않은 입력값을 이어서 불러왔습니다.`; }
    else if(currentRecord){ st.className='rt-status'; st.textContent = `${monthLabel(ym)} 기존 저장 기록을 불러왔습니다. (수정 후 다시 저장 가능)`; }
    else if(currentPrevRecord && prevSourceYm===exactPm){ st.className='rt-status'; st.textContent = `${monthLabel(exactPm)} 데이터를 전월값으로 자동 반영했습니다.`; }
    else if(currentPrevRecord){ st.className='rt-status'; st.textContent = `전월(${monthLabel(exactPm)}) 저장 기록이 없어, 가장 최근 저장된 ${monthLabel(prevSourceYm)} 데이터를 전월값으로 자동 반영했습니다. 필요하면 직접 수정하세요.`; }
    else{ st.className='rt-status warn'; st.textContent = `이전에 저장된 데이터가 없습니다. 신규 작업이면 전월값 칸에 직접 입력해주세요.`; }
    $('btn-delete-record').style.display = currentRecord ? '' : 'none';

    if(center.type==='perf') renderPerfForm(center);
    else renderBillingForm(center);
    if(restoreDraftForm()){
      if(center.type==='perf') updatePerfPreview(center);
      else updateBillingPreview(center);
    }
  }

  // ---- 실적형(perf) 폼 ----
  function renderPerfForm(center){
    const form = $('tpl-form');
    const monthNum = Number(inputMonth.ym.split('-')[1]);
    form.innerHTML = `
      <table class="rt-table" id="perf-table">
        <thead><tr><th style="width:22%;">구분</th><th>전월 실적 (입력/수정 가능)</th><th>${monthNum}월 실적 (입력)</th><th>증감</th></tr></thead>
        <tbody>${PERF_METRICS.map(m=>`
          <tr data-id="${m.id}">
            <td class="rt-label">${m.label}</td>
            <td class="rt-num-input"><input type="number" step="any" class="perf-prev-input" data-id="${m.id}"></td>
            <td class="rt-num-input"><input type="number" step="any" class="perf-input" data-id="${m.id}"></td>
            <td class="perf-diff">-</td>
          </tr>`).join('')}</tbody>
      </table>`;
    PERF_METRICS.forEach(m=>{
      const tr = document.querySelector(`#perf-table tr[data-id="${m.id}"]`);
      const prevVal = currentPrevRecord ? currentPrevRecord[m.id] : null;
      const prevInp = tr.querySelector('.perf-prev-input');
      prevInp.value = (prevVal!==null && prevVal!==undefined) ? prevVal : '';
      prevInp.addEventListener('input', ()=>updatePerfPreview(center));
      const inp = tr.querySelector('.perf-input');
      inp.value = currentRecord && currentRecord[m.id]!==undefined && currentRecord[m.id]!==null ? currentRecord[m.id] : '';
      inp.addEventListener('input', ()=>updatePerfPreview(center));
    });
    updatePerfPreview(center);
  }
  function updatePerfPreview(center){
    const ym = inputMonth.ym;
    const monthNum = Number(ym.split('-')[1]);
    let rows = '';
    PERF_METRICS.forEach(m=>{
      const tr = document.querySelector(`#perf-table tr[data-id="${m.id}"]`);
      const cur = tr.querySelector('.perf-input').value;
      const curN = cur===''?null:Number(cur);
      const prevRaw = tr.querySelector('.perf-prev-input').value;
      const prevN = prevRaw===''?null:Number(prevRaw);
      let diffHtml = '-';
      if(curN!==null && prevN!==null){
        const diff = Math.round((curN-prevN)*10)/10;
        diffHtml = arrowSpan(diff, m.unit, m.decimals);
      }
      tr.querySelector('.perf-diff').innerHTML = diffHtml;
      rows += `<tr><td class="rt-label">${m.label}</td><td>${prevN!==null?(m.decimals?fmt1(prevN):fmt(prevN))+m.unit:'-'}</td><td>${curN!==null?(m.decimals?fmt1(curN):fmt(curN))+m.unit:'-'}</td><td>${diffHtml}</td></tr>`;
    });
    $('tpl-preview').innerHTML = `<div style="font-weight:700;margin-bottom:6px;">${center.name} — ${monthNum}월 실적</div>
      <div class="rt-copy-section">
        <div class="rt-copy-section-head"><span>${monthNum}월 운영실적표</span><button class="rt-mini-copy-btn">이 표만 복사</button></div>
        <table class="rt-table"><thead><tr><th style="width:22%;">구분</th><th>전월 실적</th><th>${monthNum}월 실적</th><th>증감</th></tr></thead><tbody>${rows}</tbody></table>
      </div>`;
  }

  // ---- 청구·도급비형(billing) 폼 ----

    if(cfg.hasAuto){

          <div class="rt-field" style="max-width:180px;"><label>건당 단가 (원, 부가세 제외)</label><input type="number" id="bill-unitprice" value="${cfg.unitPriceDefault||0}"></div>

  }

  function updateBillingPreview(center){
    const cfg = center.config;
    const ym = inputMonth.ym;
    let sumSupply=0,sumVat=0,sumTotal=0;
    const curSupplies = [];
    cfg.rowLabels.forEach((label,i)=>{
      const inp = document.querySelector(`.bill-supply[data-idx="${i}"]`);
      const supply = inp.value===''?0:Number(inp.value);
      curSupplies.push(inp.value===''?null:supply);
      const vat = round10(supply), total = supply+vat;
      document.querySelector(`.bill-vat[data-idx="${i}"]`).textContent = inp.value===''?'-':fmt(vat);
      document.querySelector(`.bill-total[data-idx="${i}"]`).textContent = inp.value===''?'-':fmt(total);
      sumSupply+=supply; sumVat+=vat; sumTotal+=total;
    });
    if(cfg.rowLabels.length>1){
      document.querySelector('.bill-sum-supply').textContent = fmt(sumSupply);
      document.querySelector('.bill-sum-vat').textContent = fmt(sumVat);
      document.querySelector('.bill-sum-total').textContent = fmt(sumTotal);
    }

    // 전월청구 — 입력칸(직접 수정 가능) 값을 기준으로 계산
    const prevSupplies = cfg.rowLabels.map((_,i)=>{
      const v = document.querySelector(`.bill-prev[data-idx="${i}"]`).value;
      return v===''?null:Number(v);
    });
    const prevSumFinal = prevSupplies.every(v=>v!==null) ? prevSupplies.reduce((a,b)=>a+b,0) : (prevSupplies.some(v=>v!==null) ? prevSupplies.reduce((a,b)=>a+(b||0),0) : null);

    cfg.rowLabels.forEach((label,i)=>{
      const cur = curSupplies[i];
      const prev = prevSupplies[i];
      const diff = (cur!==null && prev!==null) ? cur-prev : null;
      if(cfg.hasContract){
        const cell = document.querySelector(`.bill-diff-contract[data-idx="${i}"]`);
        if(cell) cell.textContent = signedFmt(cur!==null?cur-(cfg.contractAmount||0):null);
      }
      document.querySelector(`.bill-diff-prev[data-idx="${i}"]`).textContent = signedFmt(diff);
    });
    if(cfg.rowLabels.length>1){
      const curTotalSum = curSupplies.every(v=>v!==null) ? curSupplies.reduce((a,b)=>a+b,0) : null;
      const diffTotal = (curTotalSum!==null && prevSumFinal!==null) ? curTotalSum-prevSumFinal : null;
      document.querySelector('.bill-sum-prev').textContent = prevSumFinal!==null?fmt(prevSumFinal):'-';
      document.querySelector('.bill-sum-diff').textContent = signedFmt(diffTotal);
    }

    // 자동이체
    let autoSupply=null, autoVat=null, autoTotal=null, autoPrev=null;
    if(cfg.hasAuto){
      const unitPrice = Number($('bill-unitprice').value||0);
      const count = $('bill-autocount').value===''?null:Number($('bill-autocount').value);
      autoSupply = count!==null ? unitPrice*count : null;
      autoVat = autoSupply!==null ? round10(autoSupply) : null;
      autoTotal = autoSupply!==null ? autoSupply+autoVat : null;
      document.querySelector('.bill-auto-supply').textContent = autoSupply===null?'-':fmt(autoSupply);
      document.querySelector('.bill-auto-vat').textContent = autoVat===null?'-':fmt(autoVat);
      document.querySelector('.bill-auto-total').textContent = autoTotal===null?'-':fmt(autoTotal);
      const autoPrevRaw = $('bill-auto-prev').value;
      autoPrev = autoPrevRaw===''?null:Number(autoPrevRaw);
      const autoDiff = (autoSupply!==null && autoPrev!==null) ? autoSupply-autoPrev : null;
      document.querySelector('.bill-auto-diff-cell').textContent = signedFmt(autoDiff);
    }

    // 코멘트 자동초안 — 전월청구(직접 수정한 값 포함) 기준으로 매번 재작성
    const commentEl = $('bill-comment');
    if(commentEl && !commentEl.dataset.userEdited){
      let lines = [];
      const curTotalSum = curSupplies.every(v=>v!==null) ? curSupplies.reduce((a,b)=>a+b,0) : null;
      const amtDiff = (curTotalSum!==null && prevSumFinal!==null) ? curTotalSum-prevSumFinal : null;

      if(cfg.headcountEnabled){
        const hc = $('bill-headcount').value===''?null:Number($('bill-headcount').value);
        const prevHc = currentPrevRecord ? currentPrevRecord.headcount : null;
        if(hc!==null && prevHc!==null && prevHc!==undefined){
          const hcDiff = hc-prevHc;
          const hcArrow = hcDiff>0?'▲':hcDiff<0?'▼':'-';
          const amtArrow = amtDiff===null?'':(amtDiff>0?'▲':amtDiff<0?'▼':'-');
          const amtText = amtDiff!==null ? ` (전월대비 청구금액 ${amtArrow}${fmt(Math.abs(amtDiff))}원)` : '';
          lines.push(`청구인원 : 전월 ${prevHc}명 → 당월 ${hc}명, ${hcArrow}${Math.abs(hcDiff)}명${amtText}`);
        }
      }else if(curTotalSum!==null && prevSumFinal!==null){
        const arrow = amtDiff===0?'-':(amtDiff>0?'▲':'▼');
        lines.push(`전월 청구금액 ${fmt(prevSumFinal)}원 → 당월 ${fmt(curTotalSum)}원, ${arrow}${fmt(Math.abs(amtDiff))}원`);
      }

      if(cfg.hasAuto && autoSupply!==null && autoPrev!==null){
        const count = $('bill-autocount').value===''?null:Number($('bill-autocount').value);
        const prevAutoCount = currentPrevRecord ? currentPrevRecord.autoCount : null;
        const autoAmtDiff = autoSupply-autoPrev;
        const amtArrow = autoAmtDiff===0?'-':(autoAmtDiff>0?'▲':'▼');
        if(count!==null && prevAutoCount!==null && prevAutoCount!==undefined){
          const cntDiff = count-prevAutoCount;
          const cntArrow = cntDiff>0?'▲':cntDiff<0?'▼':'-';
          lines.push(`전환건수 : 전월 ${prevAutoCount}건 → 당월 ${count}건, ${cntArrow}${Math.abs(cntDiff)}건 (전월대비 청구금액 ${amtArrow}${fmt(Math.abs(autoAmtDiff))}원)`);
        }
      }
      commentEl.value = lines.join('\n');
    }

    // 프리뷰 (읽기전용 마크업을 새로 생성 — 입력 표를 복제하지 않음)
    const hcHtml = cfg.headcountEnabled ? `청구인원 : ${$('bill-headcount').value||'-'}명 &nbsp;|&nbsp; ` : '';
    let previewRows = '';
    cfg.rowLabels.forEach((label,i)=>{
      const supply = curSupplies[i];
      const vat = supply!==null ? round10(supply) : null;
      const total = supply!==null ? supply+vat : null;
      previewRows += `<tr><td class="rt-label">${label}</td><td>${supply===null?'-':fmt(supply)}</td><td>${vat===null?'-':fmt(vat)}</td><td>${total===null?'-':fmt(total)}</td></tr>`;
    });
    if(cfg.rowLabels.length>1){
      previewRows += `<tr class="rt-total"><td class="rt-label">합계</td><td>${fmt(sumSupply)}</td><td>${fmt(sumVat)}</td><td>${fmt(sumTotal)}</td></tr>`;
    }
    const previewMainTable = `<div class="rt-copy-section">
      <div class="rt-copy-section-head"><span>청구총액표</span><button class="rt-mini-copy-btn">이 표만 복사</button></div>
      <table class="rt-table"><thead><tr><th style="width:30%;">구분</th><th>공급가액</th><th>부가세</th><th>합계금액</th></tr></thead><tbody>${previewRows}</tbody></table>
    </div>`;
    let previewDiffRows = '';
    cfg.rowLabels.forEach((label,i)=>{
      const cur = curSupplies[i], prev = prevSupplies[i];
      const diff = (cur!==null && prev!==null) ? cur-prev : null;
      previewDiffRows += `<tr><td class="rt-label">${label}</td>${cfg.hasContract?`<td>${fmt(cfg.contractAmount)}</td><td>${signedFmt(cur!==null?cur-(cfg.contractAmount||0):null)}</td>`:''}<td>${prev!==null?fmt(prev):'-'}</td><td>${signedFmt(diff)}</td></tr>`;
    });
    if(cfg.rowLabels.length>1){
      const curTotalSum = curSupplies.every(v=>v!==null) ? curSupplies.reduce((a,b)=>a+b,0) : null;
      const diffTotal = (curTotalSum!==null && prevSumFinal!==null) ? curTotalSum-prevSumFinal : null;
      previewDiffRows += `<tr class="rt-total"><td class="rt-label">합계</td>${cfg.hasContract?'<td>-</td><td>-</td>':''}<td>${prevSumFinal!==null?fmt(prevSumFinal):'-'}</td><td>${signedFmt(diffTotal)}</td></tr>`;
    }
    const previewDiffTable = `<div class="rt-copy-section">
      <div class="rt-copy-section-head"><span>전월 대비 비교표</span><button class="rt-mini-copy-btn">이 표만 복사</button></div>
      <table class="rt-table"><thead><tr><th style="width:26%;">구분</th>${cfg.hasContract?'<th>계약금액</th><th>계약대비</th>':''}<th>전월청구</th><th>전월대비</th></tr></thead><tbody>${previewDiffRows}</tbody></table>
    </div>`;
    let previewAutoHtml = '';
    if(cfg.hasAuto){
      const autoDiff = (autoSupply!==null && autoPrev!==null) ? autoSupply-autoPrev : null;
      const autoDiffRow = `<tr><td class="rt-label">${cfg.autoLabel}</td><td>${autoPrev!==null?fmt(autoPrev):'-'}</td><td>${signedFmt(autoDiff)}</td></tr>`;
      previewAutoHtml = `<div style="font-weight:700;margin:10px 0 4px;">${cfg.autoLabel}</div>
        <div class="rt-copy-section">
          <div class="rt-copy-section-head"><span>${cfg.autoLabel} 청구표</span><button class="rt-mini-copy-btn">이 표만 복사</button></div>
          <table class="rt-table"><thead><tr><th style="width:30%;">구분</th><th>공급가액</th><th>부가세</th><th>합계금액</th></tr></thead>
          <tbody><tr><td class="rt-label">도급수수료</td><td>${autoSupply===null?'-':fmt(autoSupply)}</td><td>${autoVat===null?'-':fmt(autoVat)}</td><td>${autoTotal===null?'-':fmt(autoTotal)}</td></tr></tbody></table>
        </div>
        <div class="rt-copy-section">
          <div class="rt-copy-section-head"><span>${cfg.autoLabel} 전월대비표</span><button class="rt-mini-copy-btn">이 표만 복사</button></div>
          <table class="rt-table"><thead><tr><th style="width:30%;">구분</th><th>전월청구</th><th>전월대비</th></tr></thead><tbody>${autoDiffRow}</tbody></table>
        </div>`;
    }
    $('tpl-preview').innerHTML = `
      <div style="font-size:11.5px;color:var(--sub);margin-bottom:8px;">${center.name} — ${periodText(center,ym)} &nbsp;|&nbsp; ${hcHtml}세금계산서 발행일 : ${$('in-taxdate').value||'-'}</div>
      ${previewMainTable}
      <div style="font-weight:700;margin:10px 0 4px;">전월 대비 비교</div>
      ${previewDiffTable}
      ${commentEl ? `<div style="margin:6px 0;white-space:pre-wrap;">${commentEl.value}</div>` : ''}
      ${previewAutoHtml}
    `;
  }

  // ---- AI 자동입력 실행 ----
  async function runAiFill(center){
    const btn = $('ai-fill-btn'); const orig = btn.textContent;
    const text = $('ai-paste').value;
    const files = $('ai-image').files;
    if(!text.trim() && (!files || !files.length)){ toast('텍스트나 이미지를 입력해주세요.'); return; }
    btn.disabled = true; btn.textContent = '분석 중...';
    try{
      let fieldsSpec;
      if(center.type==='perf'){
        fieldsSpec = PERF_METRICS.map(m=>({id:m.id, label:`${m.label}${m.unit==='%'?'(%)':''}`}));
      }else{
        fieldsSpec = center.config.rowLabels.map((label,i)=>({id:'row'+i, label: label+' 공급가액'}));
        if(center.config.hasAuto) fieldsSpec.push({id:'autoCount', label:'자동이체 전환건수'});
        if(center.config.headcountEnabled) fieldsSpec.push({id:'headcount', label:'청구인원'});
      }
      const parsed = await aiAutoFill(fieldsSpec, text, files);
      let filled = 0;
      if(center.type==='perf'){
        PERF_METRICS.forEach(m=>{
          const v = parsed[m.id];
          if(v!==null && v!==undefined && v!==''){ document.querySelector(`.perf-input[data-id="${m.id}"]`).value = v; filled++; }
        });
        updatePerfPreview(center);
      }else{
        center.config.rowLabels.forEach((_,i)=>{
          const v = parsed['row'+i];
          if(v!==null && v!==undefined && v!==''){ document.querySelector(`.bill-supply[data-idx="${i}"]`).value = v; filled++; }
        });
        if(center.config.hasAuto && parsed.autoCount!==null && parsed.autoCount!==undefined){ $('bill-autocount').value = parsed.autoCount; filled++; }
        if(center.config.headcountEnabled && parsed.headcount!==null && parsed.headcount!==undefined){ $('bill-headcount').value = parsed.headcount; filled++; }
        updateBillingPreview(center);
      }
      toast(filled>0 ? `${filled}개 값을 반영했습니다. 저장 전 확인해주세요.` : '값을 찾지 못했습니다. 직접 입력해주세요.');
    }catch(e){ console.error(e); toast('자동 인식 실패: ' + (e.message || '알 수 없는 오류') + ' — 잠시 후 다시 시도해주세요.'); }
    finally{ btn.disabled = false; btn.textContent = orig; }
  }

  // ---- 저장 / 삭제 ----
  async function saveRecord(center){
    const ym = inputMonth.ym;
    let record = {};
    if(center.type==='perf'){
      let complete = true;
      PERF_METRICS.forEach(m=>{
        const v = document.querySelector(`.perf-input[data-id="${m.id}"]`).value;
        if(v==='') complete = false;
        record[m.id] = v===''?null:Number(v);
      });
      if(!complete){ toast('모든 값을 입력한 뒤 저장하세요.'); return; }
    }else{
      const cfg = center.config;
      record.supplies = cfg.rowLabels.map((_,i)=>{
        const v = document.querySelector(`.bill-supply[data-idx="${i}"]`).value;
        return v===''?0:Number(v);
      });
      if(cfg.hasAuto){
        const unitPrice = Number($('bill-unitprice').value||0);
        const count = $('bill-autocount').value===''?0:Number($('bill-autocount').value);
        record.autoCount = count;
        record.autoSupply = unitPrice*count;
      }
      if(cfg.headcountEnabled) record.headcount = $('bill-headcount').value===''?null:Number($('bill-headcount').value);
      record.comment = $('bill-comment').value;
    }
    record.taxDate = $('in-taxdate') ? $('in-taxdate').value : null;
    record.savedAt = new Date().toISOString();
    await storageSet(`rec__${center.id}__${ym}`, record);
    delete draftCache[draftKey()];
    formDirty = false;
    toast(`${monthLabel(ym)} 기록을 저장했습니다.`);
    currentRecord = record;
    $('btn-delete-record').style.display = '';
  }
  async function deleteRecord(center){
    if(!confirm(`${monthLabel(inputMonth.ym)} 기록을 삭제할까요?`)) return;
    await storageDelete(`rec__${center.id}__${inputMonth.ym}`);
    toast('삭제했습니다.');
    currentRecord = null;
    $('btn-delete-record').style.display = 'none';
    if(center.type==='perf') renderPerfForm(center); else renderBillingForm(center);
  }

  // ---------- 성과급 탭 ----------
  let bonusMonth = null; // {centerId, ym, payoutTypeId}
  async function renderCenterBonus(center, payoutTypeId){
    const container = $('center-sub-content');
    const types = center.payoutTypes || [];

        <div class="rt-field" style="max-width:220px;"><label>${f.label}</label>${f.type==='textarea'?`<textarea class="rt-comment" id="rp-f-${f.id}" style="min-height:70px;"></textarea>`:`<input type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" id="rp-f-${f.id}">`}</div>
      `).join('');
      kind.fields.forEach(f=>{
        const el = $('rp-f-'+f.id);
        el.value = existing && existing[f.id]!==undefined && existing[f.id]!==null ? existing[f.id] : (f.default!==undefined ? f.default : '');
        el.addEventListener('input', updatePreview);
      });
      $('rp-delete').style.display = existing ? '' : 'none';
      updatePreview();
    }

    function updatePreview(){
      const kind = cfg.kinds.find(k=>k.id===reportMonth.kindId);
      const pType = kind.periodType || 'month';
      const id = reportMonth.ym;
      let ctx;
      if(pType==='month'){
        const [y,m] = id.split('-');
        ctx = { ymLong:`${y}년 ${Number(m)}월`, ymShort:`${y}년${Number(m)}월`, periodText:periodDateRangeText('month', id) };
      }else{
        ctx = { ymLong: periodLabel(pType,id), ymShort: periodLabel(pType,id).replace(' ',''), periodText: periodDateRangeText(pType, id) };
      }
      const values = {};
      kind.fields.forEach(f=>{ values[f.id] = $('rp-f-'+f.id).value; });
      const builder = SIMPLE_REPORT_PARAGRAPH[kind.id];
      $('rp-preview').textContent = builder ? builder(center, kind, ctx, values) : JSON.stringify(values);
    }

    $('rp-period-prev').addEventListener('click', async ()=>{ reportMonth.ym = periodShift(periodType, reportMonth.ym, -1); await renderCenterSimpleReport(center, fixedKindId); });
    $('rp-period-next').addEventListener('click', async ()=>{ reportMonth.ym = periodShift(periodType, reportMonth.ym, 1); await renderCenterSimpleReport(center, fixedKindId); });
    if(periodType==='month'){
      $('rp-period').addEventListener('change', async ()=>{ reportMonth.ym = $('rp-period').value; await renderFieldsAndLoad(); });
    }
    $('rp-copy').addEventListener('click', ()=>copyText($('rp-preview').textContent));
    $('rp-save').addEventListener('click', async ()=>{
      const kind = cfg.kinds.find(k=>k.id===reportMonth.kindId);
      const rec = { savedAt: new Date().toISOString() };
      kind.fields.forEach(f=>{ rec[f.id] = $('rp-f-'+f.id).value; });
      await storageSet(`report__${center.id}__${kind.id}__${reportMonth.ym}`, rec);
      toast(`${periodLabel(periodType, reportMonth.ym)} ${kind.label} 기록을 저장했습니다.`);
      $('rp-delete').style.display = '';
    });
    $('rp-delete').addEventListener('click', async ()=>{
      const kind = cfg.kinds.find(k=>k.id===reportMonth.kindId);
      if(!confirm(`${periodLabel(periodType, reportMonth.ym)} ${kind.label} 기록을 삭제할까요?`)) return;
      await storageDelete(`report__${center.id}__${kind.id}__${reportMonth.ym}`);
      toast('삭제했습니다.');
      $('rp-delete').style.display = 'none';
    });

    await renderFieldsAndLoad();
  }

  // ---------- 이벤트 로그 탭 (채용공고/채용알림처럼 주기 없이 건별로 계속 추가되는 문서) ----------
  const EVENT_LOG_PARAGRAPH = {
    'hire-request': (center, kind, v) => {
      let body = `제 목 : ${center.name} 상담사 채용 공고 협조 요청\n\n`;
      body += `2. ${center.name} 상담사 채용 공고 협조 관련 사항을 아래와 같이 전달드리며, 업무에 최선을 다하겠습니다.\n`;
      body += `가. 자격요건\n${v.qualification||'-'}\n`;
      body += `나. 모집기간 : ${v.startDate||'-'} ~ ${v.period||'채용시까지'}\n`;
      return body;
    },
    'hire-notice': (center, kind, v) => {
      let body = `제 목 : ${center.name} 상담인력 채용 알림\n\n`;
      body += `2. ${center.name} 상담인력 채용 관련하여 아래와 같이 보고드리며 업무에 최선을 다하겠습니다.\n`;
      body += `가. 채용인원 : ${v.headcount||'-'}명\n`;
      (v.rows||[]).forEach((r,i)=>{ body += `  ${i+1}. ${r.name||'-'} — ${r.career||'-'}\n`; });
      body += `나. 채용 기준 : ${v.criteria||'-'}\n`;
      body += `다. 채용 일자 : ${v.hireDate||'-'}\n`;
      return body;
    },
  };
  let eventLogState = null; // {centerId, kindId, entryId}
  async function renderCenterEventLog(center, fixedKindId){
    const container = $('center-sub-content');
    const cfg = center.eventLogConfig || {kinds:[]};
    const kind = cfg.kinds.find(k=>k.id===fixedKindId);
    if(!kind){ container.innerHTML = `<div class="rt-empty">등록된 로그 종류를 찾을 수 없습니다.</div>`; return; }
    if(!eventLogState || eventLogState.centerId!==center.id || eventLogState.kindId!==fixedKindId){
      eventLogState = { centerId:center.id, kindId:fixedKindId, entryId:null };
    }

    container.innerHTML = `
      <div class="rt-status" id="el-mode-status">새 항목을 작성 중입니다.</div>
      <div class="rt-row" style="margin-top:10px;">
        <div class="rt-field" style="max-width:200px;"><label>작성(발생)일자</label><input type="date" id="el-entrydate"></div>
      </div>
      <div class="rt-row" id="el-fields-row"></div>
      <div id="el-rows-wrap" style="display:${kind.hasRows?'':'none'};">
        <div class="rt-section-title">${kind.rowsTitle||'세부 목록'}</div>
        <table class="rt-table" id="el-rows-table">
          <thead><tr>${(kind.rowFields||[]).map(f=>`<th>${f.label}</th>`).join('')}<th></th></tr></thead>
          <tbody></tbody>
        </table>
        <button type="button" class="rt-btn rt-btn-ghost rt-btn-sm" id="el-row-add" style="margin-top:6px;">+ 행 추가</button>
      </div>
      <div class="rt-section-title">복사용 미리보기</div>
      <div class="rt-copy-target" id="el-preview" style="white-space:pre-wrap;font-size:12.8px;"></div>
      <div class="rt-actions">
        <button class="rt-btn rt-btn-primary" id="el-save">저장</button>
        <button class="rt-btn rt-btn-ghost" id="el-new">새 항목 작성</button>
        <button class="rt-btn rt-btn-ghost" id="el-copy">문단 복사</button>
        <button class="rt-btn rt-btn-danger" id="el-delete" style="display:none;">이 항목 삭제</button>
      </div>
      <div class="rt-section-title">지난 기록</div>
      <div id="el-list"></div>
    `;

    function renderRowsTable(rowsData){
      document.querySelector('#el-rows-table tbody').innerHTML = (rowsData||[]).map((r,i)=>`
        <tr data-i="${i}">${(kind.rowFields||[]).map(f=>`<td class="rt-num-input"><input type="text" class="el-row-f" data-field="${f.id}" data-i="${i}" value="${(r[f.id]||'').toString().replace(/"/g,'&quot;')}"></td>`).join('')}<td><button class="rt-btn rt-btn-danger rt-btn-sm el-row-del">삭제</button></td></tr>
      `).join('');
      document.querySelectorAll('.el-row-f').forEach(inp=>inp.addEventListener('input', updatePreview));
      document.querySelectorAll('.el-row-del').forEach(b=>b.addEventListener('click', ()=>{ b.closest('tr').remove(); updatePreview(); }));
    }
    function readRowsTable(){
      return [...document.querySelectorAll('#el-rows-table tbody tr')].map(tr=>{
        const obj = {};
        (kind.rowFields||[]).forEach(f=>{ obj[f.id] = tr.querySelector(`.el-row-f[data-field="${f.id}"]`).value; });
        return obj;
      });
    }

    async function loadEntry(){
      let existing = null;
      if(eventLogState.entryId){
        existing = await storageGet(`eventlog__${center.id}__${kind.id}__${eventLogState.entryId}`);
      }
      $('el-mode-status').textContent = eventLogState.entryId ? '기존 항목을 수정하고 있습니다.' : '새 항목을 작성 중입니다.';
      $('el-entrydate').value = existing && existing.entryDate ? existing.entryDate : new Date().toISOString().slice(0,10);
      $('el-fields-row').innerHTML = kind.fields.map(f=>`
        <div class="rt-field" style="max-width:240px;"><label>${f.label}</label>${f.type==='textarea'?`<textarea class="rt-comment" id="el-f-${f.id}" style="min-height:70px;"></textarea>`:`<input type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" id="el-f-${f.id}">`}</div>
      `).join('');
      kind.fields.forEach(f=>{
        const el = $('el-f-'+f.id);
        el.value = existing && existing[f.id]!==undefined && existing[f.id]!==null ? existing[f.id] : (f.default!==undefined?f.default:'');
        el.addEventListener('input', updatePreview);
      });
      $('el-entrydate').addEventListener('input', updatePreview);
      if(kind.hasRows) renderRowsTable(existing ? existing.rows : []);
      $('el-delete').style.display = eventLogState.entryId ? '' : 'none';
      updatePreview();
      await renderList();
    }

    function updatePreview(){
      const values = {};
      kind.fields.forEach(f=>{ values[f.id] = $('el-f-'+f.id).value; });
      if(kind.hasRows) values.rows = readRowsTable();
      const builder = EVENT_LOG_PARAGRAPH[kind.id];
      $('el-preview').textContent = builder ? builder(center, kind, values) : JSON.stringify(values);
    }

    async function renderList(){
      const hist = await storageList(`eventlog__${center.id}__${kind.id}__`);
      $('el-list').innerHTML = hist.length ? hist.map(item=>{
        const entryId = item.key.split('__').pop();
        const d = item.value.entryDate || (item.value.savedAt||'').slice(0,10);
        let summary = kind.hasRows ? `${(item.value.rows||[]).length}명` : (item.value[kind.fields[0].id]||'-');
        return `<div class="rt-history-row"><div class="info"><b>${d}</b> · ${summary}</div>
          <div class="ops"><button class="rt-btn rt-btn-ghost rt-btn-sm" data-edit="${entryId}">수정</button><button class="rt-btn rt-btn-danger rt-btn-sm" data-del="${entryId}">삭제</button></div></div>`;
      }).join('') : `<div class="rt-empty">저장된 기록이 없습니다.</div>`;
      $('el-list').querySelectorAll('[data-edit]').forEach(b=>{
        b.addEventListener('click', async ()=>{ eventLogState.entryId = b.dataset.edit; await loadEntry(); });
      });
      $('el-list').querySelectorAll('[data-del]').forEach(b=>{
        b.addEventListener('click', async ()=>{
          if(!confirm('이 기록을 삭제할까요?')) return;
          await storageDelete(`eventlog__${center.id}__${kind.id}__${b.dataset.del}`);
          if(eventLogState.entryId===b.dataset.del) eventLogState.entryId = null;
          toast('삭제했습니다.');
          await loadEntry();
        });
      });
    }

    $('el-new').addEventListener('click', async ()=>{ eventLogState.entryId = null; await loadEntry(); });
    $('el-copy').addEventListener('click', ()=>copyText($('el-preview').textContent));
    $('el-save').addEventListener('click', async ()=>{
      const entryId = eventLogState.entryId || ('e'+Date.now());
      const rec = { entryDate: $('el-entrydate').value, savedAt: new Date().toISOString() };
      kind.fields.forEach(f=>{ rec[f.id] = $('el-f-'+f.id).value; });
      if(kind.hasRows) rec.rows = readRowsTable();
      await storageSet(`eventlog__${center.id}__${kind.id}__${entryId}`, rec);
      eventLogState.entryId = entryId;
      toast('저장했습니다.');
      await loadEntry();
    });
    $('el-delete').addEventListener('click', async ()=>{
      if(!eventLogState.entryId) return;
      if(!confirm('이 항목을 삭제할까요?')) return;
      await storageDelete(`eventlog__${center.id}__${kind.id}__${eventLogState.entryId}`);
      eventLogState.entryId = null;
      toast('삭제했습니다.');
      await loadEntry();
    });
    if(kind.hasRows){
      $('el-row-add').addEventListener('click', ()=>{
        const rowsData = readRowsTable();
        rowsData.push({});
        renderRowsTable(rowsData);
        updatePreview();
      });
    }

    await loadEntry();
  }
