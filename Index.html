<style>
  :root{
    --navy:#1B2A4A; --navy-light:#2E4370; --paper:#FAFAF8; --line:#D8D9DC;
    --ink:#1F2328; --sub:#6B7178; --up:#C0392B; --down:#1F5FA8; --accent:#B5893A;
    --sidebar-w:250px;
  }
  *{box-sizing:border-box;}
  .rt-wrap{
    font-family:'Noto Sans KR','Malgun Gothic',-apple-system,sans-serif;
    background:var(--paper); color:var(--ink); font-size:13.5px; line-height:1.5;
    border:1px solid var(--line); border-radius:8px; overflow:hidden;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    display:flex; min-height:640px; max-width:1180px; margin:0 auto;
  }
  /* ---------- sidebar ---------- */
  .rt-sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--navy); color:#fff;
    display:flex; flex-direction:column; max-height:800px;
  }
  .rt-sidebar-head{ padding:16px 16px 10px; }
  .rt-sidebar-head h1{ font-size:15px; font-weight:700; margin:0 0 2px; }
  .rt-sidebar-head .sub{ font-size:10.5px; color:#B9C2D6; }
  .rt-sb-status{ font-size:10px; color:#8FA0C4; margin-top:6px; }
  .rt-search{ padding:0 16px 10px; }
  .rt-search input{
    width:100%; border:none; border-radius:5px; padding:8px 10px; font-size:12.5px;
    background:rgba(255,255,255,.12); color:#fff;
  }
  .rt-search input::placeholder{ color:#9AA7C4; }
  .rt-nav-item{
    padding:10px 16px; cursor:pointer; font-size:13px; font-weight:600;
    color:#D6DCEC; border-left:3px solid transparent;
  }
  .rt-nav-item:hover{ background:rgba(255,255,255,.06); }
  .rt-nav-item.active{ background:rgba(255,255,255,.1); border-left-color:var(--accent); color:#fff; }
  .rt-center-list{ flex:1; overflow-y:auto; padding:4px 0; }
  .rt-center-group-label{ font-size:10.5px; color:#8391B3; padding:12px 16px 4px; text-transform:uppercase; letter-spacing:.4px; }
  .rt-center-item{
    padding:9px 16px 9px 20px; cursor:pointer; font-size:12.8px; color:#D6DCEC;
    border-left:3px solid transparent; display:flex; justify-content:space-between; align-items:center; gap:6px;
  }
  .rt-center-item:hover{ background:rgba(255,255,255,.06); }
  .rt-center-item.active{ background:rgba(255,255,255,.1); border-left-color:var(--accent); color:#fff; font-weight:700; }
  .rt-center-item .badge{ font-size:9.5px; background:rgba(255,255,255,.15); padding:1px 6px; border-radius:8px; color:#C6CEE4; flex-shrink:0; }
  .rt-add-center-btn{
    margin:10px 16px 16px; padding:9px; border-radius:5px; border:1px dashed #5C6C93;
    background:transparent; color:#C6CEE4; font-size:12.5px; cursor:pointer; font-weight:600;
  }
  .rt-add-center-btn:hover{ background:rgba(255,255,255,.06); color:#fff; }

  /* ---------- main content ---------- */
  .rt-main{ flex:1; overflow-y:auto; max-height:800px; padding:22px 26px 40px; background:#fff; }
  .rt-main-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; flex-wrap:wrap; gap:10px; }
  .rt-main-header h2{ font-size:18px; font-weight:700; color:var(--navy); margin:0 0 4px; }
  .rt-main-header .desc{ font-size:12px; color:var(--sub); }
  .rt-subtabs{ display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .rt-subtab{ padding:8px 14px; cursor:pointer; font-size:12.8px; font-weight:600; color:var(--sub); border-bottom:2px solid transparent; }
  .rt-subtab.active{ color:var(--navy); border-bottom-color:var(--navy); }

  .rt-row{ display:flex; gap:14px; margin-bottom:14px; flex-wrap:wrap; align-items:flex-end; }
  .rt-field{ display:flex; flex-direction:column; gap:4px; flex:1; min-width:140px; }
  .rt-field label{ font-size:11.5px; color:var(--sub); font-weight:600; }
  .rt-field input, .rt-field select, .rt-field textarea{
    border:1px solid var(--line); border-radius:4px; padding:8px 10px; font-size:13px;
    font-family:inherit; background:#fff;
  }
  .rt-field input:focus, .rt-field select:focus, .rt-field textarea:focus{ outline:none; border-color:var(--navy-light); }
  .rt-status{ font-size:11.5px; padding:6px 10px; border-radius:4px; background:#EDF3FC; color:var(--navy-light); display:inline-block; }
  .rt-status.warn{ background:#FBEFE6; color:var(--accent); }
  .rt-section-title{ font-size:12.5px; font-weight:700; color:var(--navy); margin:20px 0 9px; padding-bottom:5px; border-bottom:1px solid var(--line); }
  table.rt-table{ width:100%; border-collapse:collapse; font-size:12.6px; margin-bottom:6px; background:#fff; }
  table.rt-table th, table.rt-table td{ border:1px solid #B9BCC2; padding:6px 8px; text-align:center; }
  table.rt-table th{ background:#E7E9EE; font-weight:700; color:var(--navy); }
  table.rt-table td.rt-label{ background:#F5F5F3; font-weight:600; text-align:left; padding-left:10px; }
  table.rt-table td.rt-num-input input{ width:100%; border:none; background:transparent; text-align:right; font-size:12.6px; font-family:inherit; padding:2px; }
  table.rt-table td.rt-num-input input:focus{ outline:1px solid var(--navy-light); background:#fff; }
  table.rt-table tr.rt-total td{ font-weight:700; background:#F0F0EC; }
  .rt-arrow-up{ color:var(--up); font-weight:700; }
  .rt-arrow-down{ color:var(--down); font-weight:700; }
  .rt-arrow-flat{ color:var(--sub); }
  textarea.rt-comment{ width:100%; min-height:60px; resize:vertical; }
  .rt-actions{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .rt-btn{ border:none; border-radius:4px; padding:9px 16px; font-size:12.6px; font-weight:700; cursor:pointer; font-family:inherit; }
  .rt-btn-primary{ background:var(--navy); color:#fff; }
  .rt-btn-primary:hover{ background:var(--navy-light); }
  .rt-btn-ghost{ background:#fff; color:var(--navy); border:1px solid var(--navy); }
  .rt-btn-ghost:hover{ background:#F0F2F6; }
  .rt-btn-danger{ background:#fff; color:var(--up); border:1px solid var(--up); }
  .rt-btn-danger:hover{ background:#FDF0EE; }
  .rt-btn-sm{ padding:5px 10px; font-size:11.5px; }
  .rt-copy-target{ border:1px dashed var(--line); padding:12px; border-radius:4px; margin-top:8px; background:#fff; }
  .rt-toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff;
    padding:10px 18px; border-radius:4px; font-size:12.6px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:999; }
  .rt-toast.show{ opacity:1; }
  .rt-hint{ font-size:11px; color:var(--sub); margin-top:3px; }

  .rt-history-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border:1px solid var(--line); border-radius:5px; margin-bottom:6px; background:#FAFAF9; }
  .rt-history-row .info{ font-size:12.6px; }
  .rt-history-row .info b{ color:var(--navy); }
  .rt-history-row .ops{ display:flex; gap:6px; }
  .rt-empty{ color:var(--sub); font-size:12.6px; padding:20px; text-align:center; border:1px dashed var(--line); border-radius:6px; }

  .rt-modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:1000; }
  .rt-modal{ background:#fff; border-radius:8px; padding:22px 24px; width:440px; max-width:92vw; max-height:85vh; overflow-y:auto; }
  .rt-modal h3{ margin:0 0 14px; font-size:15px; color:var(--navy); }
  .rt-modal .rt-field{ margin-bottom:10px; }
  .rt-checkbox-row{ display:flex; align-items:center; gap:6px; font-size:12.6px; margin-bottom:4px; }
  .rt-checkbox-row input{ width:auto; }
  .rt-modal-section-title{ font-size:12.5px; font-weight:700; color:var(--navy); margin:18px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line); }
  .rt-modal .rt-hint{ margin:-4px 0 10px; }

  .rt-summary-table{ width:100%; border-collapse:collapse; font-size:12.6px; margin-bottom:20px; }
  .rt-summary-table th, .rt-summary-table td{ border:1px solid var(--line); padding:8px 10px; text-align:left; }
  .rt-summary-table th{ background:#F0F2F5; color:var(--navy); }
  .rt-summary-table tr:hover td{ background:#FAFBFD; cursor:pointer; }
  .rt-history-row{ transition:box-shadow .15s; }
  .rt-history-row:hover{ box-shadow:0 2px 6px rgba(0,0,0,.06); }

  .rt-ai-box{ border:1px solid var(--line); border-radius:5px; padding:12px; margin-bottom:16px; background:#FAFBFD; }
  .rt-ai-box .rt-row{ margin-bottom:8px; }
  input[type="file"]{ font-size:12px; }

  @media (max-width: 760px) and (min-width: 481px){
    .rt-sidebar{ width:200px; }
  }
  @media (max-width: 480px){
    .rt-wrap{ flex-direction:column; }
    .rt-sidebar{ width:100%; max-height:420px; }
    .rt-center-list{ max-height:220px; }
    .rt-main{ max-height:none; }
  }
</style>

<div class="rt-wrap">
  <aside class="rt-sidebar">
    <div class="rt-sidebar-head">
      <h1>월간 보고서 자동화</h1>
      <div class="sub">센터별 청구·실적 자동계산</div>
      <div class="rt-sb-status" id="rt-sb-status"></div>
    </div>
    <div class="rt-search"><input id="side-search" placeholder="센터·월 검색"></div>
    <div class="rt-nav-item active" data-view="all" id="nav-all">전체 보기</div>
    <div class="rt-center-list" id="side-centers"></div>
    <button class="rt-add-center-btn" id="btn-add-center">+ 센터 추가</button>
  </aside>
  <main class="rt-main" id="rt-main"></main>
</div>

<div class="rt-toast" id="rt-toast"></div>
<div id="rt-modal-root"></div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => (n===null||n===undefined||n===''||isNaN(n)) ? '-' : Number(n).toLocaleString('ko-KR');
  const fmt1 = (n) => (n===null||n===undefined||n===''||isNaN(n)) ? '-' : Number(n).toFixed(1);
  const uid = () => 'c_' + Math.random().toString(36).slice(2,10);

  function toast(msg){
    const t = $('rt-toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1800);
  }

  function prevMonth(ym){
    const [y,m] = ym.split('-').map(Number);
    const d = new Date(y, m-2, 1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  function monthLabel(ym){ const [y,m]=ym.split('-'); return `${y}년 ${Number(m)}월`; }
  function lastDay(ym){ const [y,m]=ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
  function round10(supply){ return Math.round((supply||0) * 0.1); }
  function lgPeriodText(ym){
    const [y,m] = ym.split('-').map(Number);
    const pd = new Date(y, m-2, 20);
    return `${pd.getFullYear()}. ${pd.getMonth()+1}. 20. ~ ${y}. ${m}. 19.`;
  }
  function periodText(center, ym){
    if(center.type==='billing' && center.config.periodRule==='prev20cur19') return lgPeriodText(ym);
    const [y,m] = ym.split('-').map(Number);
    return `${y}. ${m}. 1. ~ ${y}. ${m}. ${lastDay(ym)}.`;
  }
  function arrowSpan(diff, unit, decimals){
    if(diff===null||diff===undefined||isNaN(diff)) return '<span class="rt-arrow-flat">-</span>';
    const val = decimals ? Math.abs(diff).toFixed(decimals) : fmt(Math.abs(diff));
    if(diff>0) return `<span class="rt-arrow-up">▲ ${val}${unit}</span>`;
    if(diff<0) return `<span class="rt-arrow-down">▼ ${val}${unit}</span>`;
    return `<span class="rt-arrow-flat">- (동일)</span>`;
  }
  function signedFmt(diff){
    if(diff===null||diff===undefined||isNaN(diff)) return '-';
    if(diff===0) return '-';
    return (diff>0?'+':'') + fmt(diff);
  }

  function copyHtml(el){
    const html = el.innerHTML, text = el.innerText;
    try{
      const item = new ClipboardItem({'text/html': new Blob([html],{type:'text/html'}), 'text/plain': new Blob([text],{type:'text/plain'})});
      navigator.clipboard.write([item]).then(()=>toast('표를 복사했습니다.'));
    }catch(e){
      const range = document.createRange(); range.selectNode(el);
      window.getSelection().removeAllRanges(); window.getSelection().addRange(range);
      try{ document.execCommand('copy'); toast('표를 복사했습니다.'); }catch(e2){ toast('복사 실패 - 직접 드래그해서 복사해주세요.'); }
      window.getSelection().removeAllRanges();
    }
  }
  function copyText(text){
    navigator.clipboard.writeText(text).then(()=>toast('복사했습니다.')).catch(()=>toast('복사 실패'));
  }

  // ---------- Supabase / 저장소 어댑터 ----------
  const SB_URL = 'https://zbiwyqwjehnogxkzlhxx.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpiaXd5cXdqZWhub2d4a3psaHh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwOTQ1MzYsImV4cCI6MjA5NjY3MDUzNn0.SQJjHnDcMTRyElxtY9E-04yIkzPVF35L8hcx0lSyG48';
  const SB_ENABLED = SB_KEY && SB_KEY !== 'YOUR_SUPABASE_ANON_KEY';

  async function sbGet(key){
    const res = await fetch(`${SB_URL}/rest/v1/rpt_kv?key=eq.${encodeURIComponent(key)}&select=value`, { headers:{apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`} });
    if(!res.ok) throw new Error('sbGet '+res.status);
    const rows = await res.json();
    return rows.length ? rows[0].value : null;
  }
  async function sbSet(key, value){
    const res = await fetch(`${SB_URL}/rest/v1/rpt_kv`, {
      method:'POST',
      headers:{apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`, 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates'},
      body: JSON.stringify({key, value, updated_at:new Date().toISOString()})
    });
    if(!res.ok) throw new Error('sbSet '+res.status);
    return true;
  }
  async function sbDelete(key){
    const res = await fetch(`${SB_URL}/rest/v1/rpt_kv?key=eq.${encodeURIComponent(key)}`, { method:'DELETE', headers:{apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`} });
    return res.ok;
  }
  async function sbList(prefix){
    const res = await fetch(`${SB_URL}/rest/v1/rpt_kv?key=like.${encodeURIComponent(prefix+'*')}&select=key,value,updated_at&order=key.desc`, { headers:{apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`} });
    if(!res.ok) return [];
    return await res.json();
  }

  async function storageGet(key){
    try{
      if(SB_ENABLED) return await sbGet(key);
      const r = await window.storage.get(key);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  async function storageSet(key, obj){
    try{
      if(SB_ENABLED) return await sbSet(key, obj);
      await window.storage.set(key, JSON.stringify(obj));
      return true;
    }catch(e){ console.error(e); return false; }
  }
  async function storageDelete(key){
    try{
      if(SB_ENABLED) return await sbDelete(key);
      await window.storage.delete(key);
      return true;
    }catch(e){ return false; }
  }
  async function storageList(prefix){
    try{
      if(SB_ENABLED) return await sbList(prefix);
      const r = await window.storage.list(prefix);
      if(!r || !r.keys) return [];
      const out = [];
      for(const k of r.keys){ const v = await storageGet(k); if(v!==null) out.push({key:k, value:v}); }
      out.sort((a,b)=> a.key < b.key ? 1 : -1);
      return out;
    }catch(e){ console.error(e); return []; }
  }

  // ---------- AI 자동입력 (텍스트+이미지) ----------
  function fileToBase64(file){
    return new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }
  // AI 자동입력은 반드시 Supabase Edge Function을 통해서만 호출됩니다.
  // (claude.ai 미리보기 환경은 보안정책상 api.anthropic.com 직접 호출이 차단되어 있고,
  //  실제 배포 후에도 브라우저에 API 키를 노출하지 않기 위해 서버 프록시가 필요합니다.)
  const AI_PROXY_URL = `${SB_URL}/functions/v1/rpt-ai-parse`;

  async function callClaudeAPI(system, content){
    if(!SB_ENABLED){
      throw new Error('AI 자동입력은 Supabase 배포 후에만 사용할 수 있습니다. (SB_KEY 미설정 — 로컬 모드에서는 직접 입력해주세요)');
    }
    const resp = await fetch(AI_PROXY_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json', apikey: SB_KEY, Authorization:`Bearer ${SB_KEY}`},
      body: JSON.stringify({ system, content })
    });
    let data;
    try{ data = await resp.json(); }catch(e){ throw new Error(`서버 응답을 읽지 못했습니다 (status ${resp.status})`); }
    if(!resp.ok || data.type==='error' || (data.error)){
      const msg = (data.error && data.error.message) ? data.error.message : `API 오류 (status ${resp.status})`;
      throw new Error(msg);
    }
    return data;
  }

  async function aiAutoFill(fieldsSpec, text, imageFiles){
    const fieldDesc = fieldsSpec.map(f=>`- ${f.id}: ${f.label} (숫자만 반환, 콤마·단위·% 기호 제거)`).join('\n');
    const system = `당신은 표/문서 이미지 또는 텍스트에서 실적·청구 데이터를 추출하는 도우미입니다.
아래 필드에 해당하는 "당월" 수치를 찾아 JSON 객체 하나만 출력하세요. 설명, 코드블록 표시 없이 순수 JSON만 출력합니다.
${fieldDesc}
확실하지 않으면 해당 필드는 null로 표기하세요.`;
    const content = [];
    if(imageFiles && imageFiles.length){
      for(const f of imageFiles){
        const b64 = await fileToBase64(f);
        content.push({type:'image', source:{type:'base64', media_type: f.type || 'image/png', data:b64}});
      }
    }
    content.push({type:'text', text: text && text.trim() ? text : '위 이미지(들)의 표 내용을 분석해줘.'});

    let lastErr;
    for(let attempt=0; attempt<2; attempt++){
      try{
        const data = await callClaudeAPI(system, content);
        const textBlock = (data.content||[]).find(b=>b.type==='text');
        if(!textBlock) throw new Error('빈 응답 (다시 시도해주세요)');
        const clean = textBlock.text.replace(/```json|```/g,'').trim();
        return JSON.parse(clean);
      }catch(e){
        lastErr = e;
        if(attempt===0){ await new Promise(r=>setTimeout(r,1200)); continue; } // 1회 자동 재시도
      }
    }
    throw lastErr;
  }

  // ============================================================
  // 상태 (State)
  // ============================================================
  let centers = [];
  let currentView = { type:'all' }; // {type:'all'} | {type:'center', id, sub:'input'|'history'|'bonus'}
  let searchQuery = '';

  const PERF_METRICS = [
    {id:'inbound',   label:'인입호',            unit:'건', decimals:0},
    {id:'answered',  label:'응대호',            unit:'건', decimals:0},
    {id:'abandoned', label:'포기호',            unit:'건', decimals:0},
    {id:'rate',      label:'응대율',            unit:'%', decimals:1},
    {id:'dailyavg',  label:'1일 평균 상담건수',  unit:'건', decimals:0},
    {id:'cpd',       label:'인당CPD',           unit:'건', decimals:1},
  ];

  const TYPE_LABEL = { perf:'실적 보고형', billing:'청구·도급비형' };

  async function loadCenters(){
    const saved = await storageGet('centers');
    if(saved && saved.length){ centers = saved; return; }
    centers = defaultCenters();
    await storageSet('centers', centers);
  }
  function defaultCenters(){
    return [
      { id: uid(), name:'평택시 민원콜센터', type:'perf', config:{}, bonusEnabled:true,
        bonusConfig:{ headcountEnabled:true, targetText:'평택시 민원콜센터 상담인력', fundText:'{ymLong} 업무 성과 목표 달성', budgetLine:"급여항목의 '성과급_변동'" } },
      { id: uid(), name:'KB손해보험 제휴CS사업(부천센터)', type:'billing',
        config:{ rowLabels:['KB손해보험 제휴CS사업','ASP_KB손해보험 제휴CS사업'], periodRule:'calendar', headcountEnabled:true, hasAuto:true, autoLabel:'자동이체 전환 도급비', unitPriceDefault:15800, hasContract:false, contractAmount:null },

      <div id="all-recent"></div>`;
    const tbody = $('all-summary-body');
    let rows = '';
    const recentAll = [];
    for(const c of centers){
      const hist = await storageList(`rec__${c.id}__`);

      let summary = '-';
      if(latest){
        if(c.type==='perf') summary = `인입 ${fmt(latest.value.inbound)}건`;
        else{
          const s = (latest.value.supplies||[]).reduce((a,b)=>a+(b||0),0);
          summary = `공급가액 합계 ${fmt(s)}원`;
        }
        recentAll.push({ center:c, ym: latest.key.split('__').pop(), value: latest.value, updated_at: latest.updated_at });

      rows += `<tr data-id="${c.id}"><td>${c.name}</td><td>${TYPE_LABEL[c.type]}</td><td>${latest? monthLabel(latest.key.split('__').pop()) : '-'}</td><td>${summary}</td></tr>`;

    tbody.querySelectorAll('tr[data-id]').forEach(tr=>{
      tr.addEventListener('click', ()=>{ currentView = {type:'center', id:tr.dataset.id, sub:'history'}; renderAll(); });

  let currentRecord = null, currentPrevRecord = null;

  async function loadAndRenderTemplate(center){

    else if(currentPrevRecord){ st.className='rt-status'; st.textContent = `${monthLabel(pm)} 데이터를 전월값으로 자동 반영했습니다.`; }
    else{ st.className='rt-status warn'; st.textContent = `${monthLabel(pm)} 저장된 전월 데이터가 없습니다. 처음이면 정상입니다.`; }

  // ---- 청구·도급비형(billing) 폼 ----

    });
    if(cfg.rowLabels.length>1){
      html += `<tr class="rt-total"><td class="rt-label">합계</td><td class="bill-sum-supply">-</td><td class="bill-sum-vat">-</td><td class="bill-sum-total">-</td></tr>`;

      <div class="rt-section-title">전월 대비 비교 (자동계산)</div>
      <table class="rt-table" id="bill-diff"><thead><tr><th style="width:26%;">구분</th>${cfg.hasContract?'<th>계약금액</th><th>계약대비</th>':''}<th>전월청구</th><th>전월대비</th></tr></thead><tbody></tbody></table>`;

    if(cfg.hasAuto){
      html += `<div class="rt-section-title">${cfg.autoLabel}</div>
        <div class="rt-row">
          <div class="rt-field" style="max-width:180px;"><label>건당 단가 (원, 부가세 제외)</label><input type="number" id="bill-unitprice" value="${cfg.unitPriceDefault||0}"></div>
          <div class="rt-field" style="max-width:180px;"><label>전환건수 (건, 당월)</label><input type="number" id="bill-autocount"></div>
        </div>
        <table class="rt-table" id="bill-auto-table"><thead><tr><th style="width:30%;">구분</th><th>공급가액</th><th>부가세</th><th>합계금액</th></tr></thead>
        <tbody><tr><td class="rt-label">도급수수료</td><td class="bill-auto-supply">-</td><td class="bill-auto-vat">-</td><td class="bill-auto-total">-</td></tr></tbody></table>
        <table class="rt-table" id="bill-auto-diff"><thead><tr><th style="width:30%;">구분</th><th>전월청구</th><th>전월대비</th></tr></thead><tbody></tbody></table>`;
    }
    if(cfg.headcountEnabled){
      html = `<div class="rt-row"><div class="rt-field" style="max-width:160px;"><label>청구인원 (명)</label><input type="number" id="bill-headcount"></div></div>` + html;
    }
    html += `<div class="rt-field" style="margin-top:10px;"><label>전월 대비 문구 (자동 초안 — 필요시 수정)</label><textarea class="rt-comment" id="bill-comment"></textarea></div>`;

      $('bill-autocount').value = currentRecord && currentRecord.autoCount!==undefined ? currentRecord.autoCount : '';
      $('bill-unitprice').addEventListener('input', ()=>updateBillingPreview(center));
      $('bill-autocount').addEventListener('input', ()=>updateBillingPreview(center));

    if(cfg.headcountEnabled){
      $('bill-headcount').value = currentRecord && currentRecord.headcount!==undefined && currentRecord.headcount!==null ? currentRecord.headcount : '';

  }

  function updateBillingPreview(center){
    const cfg = center.config;
    const ym = inputMonth.ym;
    let sumSupply=0,sumVat=0,sumTotal=0;
    const curSupplies = [];
    cfg.rowLabels.forEach((label,i)=>{
      const inp = document.querySelector(`.bill-supply[data-idx="${i}"]`);
      const supply = inp.value===''?0:Number(inp.value);
      curSupplies.push(inp.value===''?null:supply);
      const vat = round10(supply), total = supply+vat;
      document.querySelector(`.bill-vat[data-idx="${i}"]`).textContent = inp.value===''?'-':fmt(vat);
      document.querySelector(`.bill-total[data-idx="${i}"]`).textContent = inp.value===''?'-':fmt(total);
      sumSupply+=supply; sumVat+=vat; sumTotal+=total;
    });
    if(cfg.rowLabels.length>1){
      document.querySelector('.bill-sum-supply').textContent = fmt(sumSupply);
      document.querySelector('.bill-sum-vat').textContent = fmt(sumVat);
      document.querySelector('.bill-sum-total').textContent = fmt(sumTotal);
    }
    const prevSupplies = currentPrevRecord ? currentPrevRecord.supplies : null;
    const prevSum = prevSupplies ? prevSupplies.reduce((a,b)=>a+(b||0),0) : null;
    let diffRows = '';
    cfg.rowLabels.forEach((label,i)=>{
      const cur = curSupplies[i];
      const prev = prevSupplies ? prevSupplies[i] : null;
      const diff = (cur!==null && prev!==null && prev!==undefined) ? cur-prev : null;
      diffRows += `<tr><td class="rt-label">${label}</td>${cfg.hasContract?`<td>${fmt(cfg.contractAmount)}</td><td>${signedFmt(cur!==null?cur-(cfg.contractAmount||0):null)}</td>`:''}<td>${(prev!==null&&prev!==undefined)?fmt(prev):'-'}</td><td>${signedFmt(diff)}</td></tr>`;
    });
    if(cfg.rowLabels.length>1){
      const curTotalSum = curSupplies.every(v=>v!==null) ? curSupplies.reduce((a,b)=>a+b,0) : null;
      const diffTotal = (curTotalSum!==null && prevSum!==null) ? curTotalSum-prevSum : null;
      diffRows += `<tr class="rt-total"><td class="rt-label">합계</td>${cfg.hasContract?'<td>-</td><td>-</td>':''}<td>${prevSum!==null?fmt(prevSum):'-'}</td><td>${signedFmt(diffTotal)}</td></tr>`;
    }
    document.querySelector('#bill-diff tbody').innerHTML = diffRows;

    // 자동이체
    let autoSupply=null, autoVat=null, autoTotal=null;
    if(cfg.hasAuto){
      const unitPrice = Number($('bill-unitprice').value||0);
      const count = $('bill-autocount').value===''?null:Number($('bill-autocount').value);
      autoSupply = count!==null ? unitPrice*count : null;
      autoVat = autoSupply!==null ? round10(autoSupply) : null;
      autoTotal = autoSupply!==null ? autoSupply+autoVat : null;
      document.querySelector('.bill-auto-supply').textContent = autoSupply===null?'-':fmt(autoSupply);
      document.querySelector('.bill-auto-vat').textContent = autoVat===null?'-':fmt(autoVat);
      document.querySelector('.bill-auto-total').textContent = autoTotal===null?'-':fmt(autoTotal);
      const prevAutoSupply = currentPrevRecord ? currentPrevRecord.autoSupply : null;
      const autoDiff = (autoSupply!==null && prevAutoSupply!==null && prevAutoSupply!==undefined) ? autoSupply-prevAutoSupply : null;
      document.querySelector('#bill-auto-diff tbody').innerHTML = `<tr><td class="rt-label">${cfg.autoLabel}</td><td>${(prevAutoSupply!==null&&prevAutoSupply!==undefined)?fmt(prevAutoSupply):'-'}</td><td>${signedFmt(autoDiff)}</td></tr>`;
    }

    // 코멘트 자동초안
    const commentEl = $('bill-comment');
    if(commentEl && !commentEl.dataset.userEdited){
      let lines = [];
      const curTotalSum = curSupplies.every(v=>v!==null) ? curSupplies.reduce((a,b)=>a+b,0) : null;
      if(curTotalSum!==null && prevSum!==null && prevSum!==undefined){
        const diff = curTotalSum-prevSum;
        lines.push(`- 전월 청구금액 ${fmt(prevSum)}원 → ${fmt(curTotalSum)}원, ${diff===0?'변동없음':(diff>0?'▲':'▼')+fmt(Math.abs(diff))+'원'}`);
      }
      if(cfg.headcountEnabled){
        const hc = $('bill-headcount').value===''?null:Number($('bill-headcount').value);
        const prevHc = currentPrevRecord ? currentPrevRecord.headcount : null;
        if(hc!==null && prevHc!==null && prevHc!==undefined && hc!==prevHc){
          lines.push(`- 전월대비 청구인원 ${prevHc}명 → ${hc}명, ${Math.abs(hc-prevHc)}명 ${hc>prevHc?'증가':'감소'}`);
        }
      }
      if(cfg.hasAuto && autoSupply!==null){
        const prevAutoCount = currentPrevRecord ? currentPrevRecord.autoCount : null;
        const count = $('bill-autocount').value===''?null:Number($('bill-autocount').value);
        if(count!==null && prevAutoCount!==null && prevAutoCount!==undefined && count!==prevAutoCount){
          lines.push(`- 전월 전환건수 ${prevAutoCount}건 대비 ${Math.abs(count-prevAutoCount)}건 ${count>prevAutoCount?'증가':'감소'}`);
        }
      }
      commentEl.value = lines.join('\n');
    }

    // 프리뷰 (읽기전용 마크업을 새로 생성 — 입력 표를 복제하지 않음)
    const hcHtml = cfg.headcountEnabled ? `청구인원 : ${$('bill-headcount').value||'-'}명 &nbsp;|&nbsp; ` : '';
    let previewRows = '';
    cfg.rowLabels.forEach((label,i)=>{
      const supply = curSupplies[i];
      const vat = supply!==null ? round10(supply) : null;
      const total = supply!==null ? supply+vat : null;
      previewRows += `<tr><td class="rt-label">${label}</td><td>${supply===null?'-':fmt(supply)}</td><td>${vat===null?'-':fmt(vat)}</td><td>${total===null?'-':fmt(total)}</td></tr>`;
    });
    if(cfg.rowLabels.length>1){
      previewRows += `<tr class="rt-total"><td class="rt-label">합계</td><td>${fmt(sumSupply)}</td><td>${fmt(sumVat)}</td><td>${fmt(sumTotal)}</td></tr>`;
    }
    const previewMainTable = `<table class="rt-table"><thead><tr><th style="width:30%;">구분</th><th>공급가액</th><th>부가세</th><th>합계금액</th></tr></thead><tbody>${previewRows}</tbody></table>`;
    const previewDiffTable = `<table class="rt-table"><thead><tr><th style="width:26%;">구분</th>${cfg.hasContract?'<th>계약금액</th><th>계약대비</th>':''}<th>전월청구</th><th>전월대비</th></tr></thead><tbody>${diffRows}</tbody></table>`;
    let previewAutoHtml = '';
    if(cfg.hasAuto){
      const autoDiffRow = document.querySelector('#bill-auto-diff tbody').innerHTML;
      previewAutoHtml = `<div style="font-weight:700;margin:10px 0 4px;">${cfg.autoLabel}</div>
        <table class="rt-table"><thead><tr><th style="width:30%;">구분</th><th>공급가액</th><th>부가세</th><th>합계금액</th></tr></thead>
        <tbody><tr><td class="rt-label">도급수수료</td><td>${autoSupply===null?'-':fmt(autoSupply)}</td><td>${autoVat===null?'-':fmt(autoVat)}</td><td>${autoTotal===null?'-':fmt(autoTotal)}</td></tr></tbody></table>
        <table class="rt-table"><thead><tr><th style="width:30%;">구분</th><th>전월청구</th><th>전월대비</th></tr></thead><tbody>${autoDiffRow}</tbody></table>`;
    }
    $('tpl-preview').innerHTML = `
      <div style="font-size:11.5px;color:var(--sub);margin-bottom:8px;">${center.name} — ${periodText(center,ym)} &nbsp;|&nbsp; ${hcHtml}세금계산서 발행일 : ${$('in-taxdate').value||'-'}</div>
      ${previewMainTable}
      <div style="font-weight:700;margin:10px 0 4px;">전월 대비 비교</div>
      ${previewDiffTable}
      ${commentEl ? `<div style="margin:6px 0;white-space:pre-wrap;">${commentEl.value}</div>` : ''}
      ${previewAutoHtml}
    `;
  }

  // ---- AI 자동입력 실행 ----
  async function runAiFill(center){
    const btn = $('ai-fill-btn'); const orig = btn.textContent;
    const text = $('ai-paste').value;
    const files = $('ai-image').files;
    if(!text.trim() && (!files || !files.length)){ toast('텍스트나 이미지를 입력해주세요.'); return; }
    btn.disabled = true; btn.textContent = '분석 중...';
    try{
      let fieldsSpec;
      if(center.type==='perf'){
        fieldsSpec = PERF_METRICS.map(m=>({id:m.id, label:`${m.label}${m.unit==='%'?'(%)':''}`}));
      }else{
        fieldsSpec = center.config.rowLabels.map((label,i)=>({id:'row'+i, label: label+' 공급가액'}));
        if(center.config.hasAuto) fieldsSpec.push({id:'autoCount', label:'자동이체 전환건수'});
        if(center.config.headcountEnabled) fieldsSpec.push({id:'headcount', label:'청구인원'});
      }
      const parsed = await aiAutoFill(fieldsSpec, text, files);
      let filled = 0;
      if(center.type==='perf'){
        PERF_METRICS.forEach(m=>{
          const v = parsed[m.id];
          if(v!==null && v!==undefined && v!==''){ document.querySelector(`.perf-input[data-id="${m.id}"]`).value = v; filled++; }
        });
        updatePerfPreview(center);
      }else{
        center.config.rowLabels.forEach((_,i)=>{
          const v = parsed['row'+i];
          if(v!==null && v!==undefined && v!==''){ document.querySelector(`.bill-supply[data-idx="${i}"]`).value = v; filled++; }
        });
        if(center.config.hasAuto && parsed.autoCount!==null && parsed.autoCount!==undefined){ $('bill-autocount').value = parsed.autoCount; filled++; }
        if(center.config.headcountEnabled && parsed.headcount!==null && parsed.headcount!==undefined){ $('bill-headcount').value = parsed.headcount; filled++; }
        updateBillingPreview(center);
      }
      toast(filled>0 ? `${filled}개 값을 반영했습니다. 저장 전 확인해주세요.` : '값을 찾지 못했습니다. 직접 입력해주세요.');
    }catch(e){ console.error(e); toast('자동 인식 실패: ' + (e.message || '알 수 없는 오류') + ' — 잠시 후 다시 시도해주세요.'); }
    finally{ btn.disabled = false; btn.textContent = orig; }
  }

  // ---- 저장 / 삭제 ----
  async function saveRecord(center){
    const ym = inputMonth.ym;
    let record = {};
    if(center.type==='perf'){
      let complete = true;
      PERF_METRICS.forEach(m=>{
        const v = document.querySelector(`.perf-input[data-id="${m.id}"]`).value;
        if(v==='') complete = false;
        record[m.id] = v===''?null:Number(v);
      });
      if(!complete){ toast('모든 값을 입력한 뒤 저장하세요.'); return; }
    }else{
      const cfg = center.config;
      record.supplies = cfg.rowLabels.map((_,i)=>{
        const v = document.querySelector(`.bill-supply[data-idx="${i}"]`).value;
        return v===''?0:Number(v);
      });
      if(cfg.hasAuto){
        const unitPrice = Number($('bill-unitprice').value||0);
        const count = $('bill-autocount').value===''?0:Number($('bill-autocount').value);
        record.autoCount = count;
        record.autoSupply = unitPrice*count;
      }
      if(cfg.headcountEnabled) record.headcount = $('bill-headcount').value===''?null:Number($('bill-headcount').value);
      record.comment = $('bill-comment').value;
    }
    record.taxDate = $('in-taxdate') ? $('in-taxdate').value : null;
    record.savedAt = new Date().toISOString();
    await storageSet(`rec__${center.id}__${ym}`, record);
    toast(`${monthLabel(ym)} 기록을 저장했습니다.`);
    currentRecord = record;
    $('btn-delete-record').style.display = '';
  }
  async function deleteRecord(center){
    if(!confirm(`${monthLabel(inputMonth.ym)} 기록을 삭제할까요?`)) return;
    await storageDelete(`rec__${center.id}__${inputMonth.ym}`);
    toast('삭제했습니다.');
    currentRecord = null;
    $('btn-delete-record').style.display = 'none';
    if(center.type==='perf') renderPerfForm(center); else renderBillingForm(center);
  }

  // ---------- 성과급 탭 ----------
  async function renderCenterBonus(center){
    const container = $('center-sub-content');
    const ym = new Date().toISOString().slice(0,7);
    container.innerHTML = `
      <div class="rt-row">
        <div class="rt-field" style="max-width:160px;"><label>기준월</label><input type="month" id="bn-month" value="${ym}"></div>
        ${center.bonusConfig.headcountEnabled?'<div class="rt-field" style="max-width:140px;"><label>지급인원 (명)</label><input type="number" id="bn-headcount"></div>':''}
        <div class="rt-field" style="max-width:180px;"><label>지급금액 (원)</label><input type="number" id="bn-amount"></div>
        <div class="rt-field" style="max-width:180px;"><label>지급일자</label><input type="date" id="bn-paydate" value="${new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="rt-section-title">복사용 미리보기</div>
      <div class="rt-copy-target" id="bn-preview" style="white-space:pre-wrap;font-size:12.8px;"></div>
      <div class="rt-actions">
        <button class="rt-btn rt-btn-primary" id="bn-save">저장</button>
        <button class="rt-btn rt-btn-ghost" id="bn-copy">문단 복사</button>
      </div>
      <div class="rt-section-title">성과급 지급 이력</div>
      <div id="bn-hist"></div>
    `;
    function update(){
      const ymv = $('bn-month').value;
      const [y,m] = ymv.split('-');
      const ctx = { ymLong:`${y}년 ${Number(m)}월`, ymShort:`${y.slice(2)}년${Number(m)}월`, ymDot:`${y}.${Number(m)}` };
      const bc = center.bonusConfig;
      const target = (bc.targetText||'').replace('{name}', center.name);
      const fund = (bc.fundText||'').replace('{ymLong}', ctx.ymLong);
      const amount = $('bn-amount').value ? fmt(Number($('bn-amount').value)) : '-';
      const paydate = $('bn-paydate').value ? $('bn-paydate').value.replace(/-/g,'. ')+'.' : '-';
      const hc = bc.headcountEnabled ? ($('bn-headcount').value||'-') : null;
      let body = `제 목 : ${center.name} 성과급 지급(${ctx.ymDot}월)\n\n`;
      body += `1. 위 관련 ${center.name}의 ${ctx.ymLong} 업무 성과에 따른 성과급을 아래와 같이 지급하오니 업무에 참조하여 주시기 바랍니다.\n`;
      body += `가. 지급대상 : ${target}\n나. 지급재원 : ${fund}\n다. 지급금액 : ${amount}원\n`;
      if(hc!==null) body += `  ㅇ 지급인원 : ${hc}명\n`;
      body += `  ㅇ 지급일자 : ${paydate}\n  ㅇ 예산과목 : ${bc.budgetLine||'성과급_변동'}\n`;
      body += `붙임 : ${center.name} 성과급 지급내역(${ctx.ymShort}) 1부.  끝.`;
      $('bn-preview').textContent = body;
    }
    $('bn-month').addEventListener('change', update);
    if(center.bonusConfig.headcountEnabled) $('bn-headcount').addEventListener('input', update);
    $('bn-amount').addEventListener('input', update);
    $('bn-paydate').addEventListener('input', update);
    update();

    $('bn-copy').addEventListener('click', ()=>copyText($('bn-preview').textContent));
    $('bn-save').addEventListener('click', async ()=>{
      const ymv = $('bn-month').value;
      const rec = { amount: $('bn-amount').value===''?null:Number($('bn-amount').value), paydate: $('bn-paydate').value,
        headcount: center.bonusConfig.headcountEnabled ? ($('bn-headcount').value===''?null:Number($('bn-headcount').value)) : null };

      toast(`${monthLabel(ymv)} 성과급 지급 기록을 저장했습니다.`);

    });

          <div class="rt-hint">켜면 센터 상세화면에 "성과급" 탭이 추가되어, 지급금액·지급일자를 입력하면 지급 안내문을 자동 생성·저장할 수 있습니다. 이니텍처럼 성과급 지급이 없는 센터는 꺼두세요.</div>
          <div id="m-bonus-fields" style="display:${c.bonusEnabled?'':'none'}; margin-top:8px;">
            <div class="rt-field"><label>지급대상 문구</label><input type="text" id="m-bonus-target" value="${c.bonusConfig.targetText||''}"></div>
            <div class="rt-hint">안내문 "가. 지급대상 : ○○○" 자리에 그대로 들어갑니다.</div>
            <div class="rt-field"><label>지급재원 문구</label><input type="text" id="m-bonus-fund" value="${c.bonusConfig.fundText||''}"></div>
            <div class="rt-hint">"나. 지급재원 : ○○○" 자리에 들어갑니다. {ymLong}을 넣으면 "2026년 7월"처럼 기준월로 자동 치환됩니다.</div>
            <div class="rt-checkbox-row"><input type="checkbox" id="m-bonus-headcount" ${c.bonusConfig.headcountEnabled?'checked':''}><label for="m-bonus-headcount">지급인원 표시</label></div>
            <div class="rt-hint">안내문에 "지급인원 : N명" 줄을 추가할지 여부입니다. (평택처럼 인원별 지급 시 사용)</div>
          </div>

          <div class="rt-actions">
            <button class="rt-btn rt-btn-primary" id="m-save">저장</button>
            <button class="rt-btn rt-btn-ghost" id="m-cancel">취소</button>
          </div>
        </div>
      </div>`;

    async function updateTypeHint(){
      const type = $('m-type').value;
      let hint = type==='perf'
        ? '평택처럼 콜센터 실적(인입호·응대율 등)을 매달 비교 보고할 때 사용합니다.'
        : 'KB/LG/이니텍처럼 매달 청구·정산 문서를 작성할 때 사용합니다.';
      if(isEdit && type!==c.type){
        const hasHistory = (await storageList(`rec__${existing.id}__`)).length > 0;
        if(hasHistory) hint += ' ⚠ 이 센터에는 저장된 기록이 있어, 유형을 바꾸면 과거 기록의 화면 표시가 맞지 않을 수 있습니다.';
      }
      $('m-type-hint').textContent = hint;
    }
    updateTypeHint();
    $('m-type').addEventListener('change', ()=>{ $('m-billing-fields').style.display = $('m-type').value==='billing' ? '' : 'none'; updateTypeHint(); });
    $('m-rowcount').addEventListener('change', ()=>{ $('m-row1-wrap').style.display = $('m-rowcount').value==='2' ? '' : 'none'; });
    $('m-hascontract').addEventListener('change', ()=>{ $('m-contract-wrap').style.display = $('m-hascontract').checked ? '' : 'none'; });
    $('m-hasauto').addEventListener('change', ()=>{ $('m-unitprice-wrap').style.display = $('m-hasauto').checked ? '' : 'none'; });
    $('m-bonus').addEventListener('change', ()=>{ $('m-bonus-fields').style.display = $('m-bonus').checked ? '' : 'none'; });
    $('m-cancel').addEventListener('click', ()=>{ root.innerHTML=''; });
    $('modal-bg').addEventListener('click', (e)=>{ if(e.target.id==='modal-bg') root.innerHTML=''; });

    $('m-save').addEventListener('click', async ()=>{
      const name = $('m-name').value.trim();
      if(!name){ toast('센터 이름을 입력하세요.'); return; }
      const type = $('m-type').value;
      if(isEdit && type!==c.type){
        const hasHistory = (await storageList(`rec__${existing.id}__`)).length > 0;
        if(hasHistory){
          const ok = confirm('이 센터에는 이미 저장된 기록이 있습니다. 유형을 바꾸면 과거 기록의 화면 표시가 맞지 않을 수 있습니다. 그래도 변경하시겠습니까?');
          if(!ok) return;
        }
      }
      let config = {};
      let bonusEnabled = $('m-bonus').checked;
      let bonusConfig = {
        targetText: $('m-bonus-target').value || '{name} 소속직원',
        fundText: $('m-bonus-fund').value || '{ymLong} 청구 금액 내 지급',
        headcountEnabled: $('m-bonus-headcount').checked,
        budgetLine: '성과급_변동',
      };
      if(type==='billing'){
        const rowCount = Number($('m-rowcount').value);
        const rowLabels = [$('m-row0').value.trim() || '청구항목1'];
        if(rowCount===2) rowLabels.push($('m-row1').value.trim() || '청구항목2');
        config = {
          rowLabels, periodRule: $('m-period').value, headcountEnabled: $('m-headcount').checked,
          hasContract: $('m-hascontract').checked, contractAmount: $('m-contract').value?Number($('m-contract').value):null,
          hasAuto: $('m-hasauto').checked, autoLabel:'자동이체 전환 도급비', unitPriceDefault: Number($('m-unitprice').value||15800),
        };
      }
      if(isEdit){
        Object.assign(existing, { name, type, config, bonusEnabled, bonusConfig });
      }else{
        centers.push({ id:c.id, name, type, config, bonusEnabled, bonusConfig });
      }
      await saveCenters();
      root.innerHTML = '';
      if(!isEdit){ currentView = {type:'center', id:c.id, sub:'input'}; }
      renderAll();
      toast(isEdit?'센터 설정을 저장했습니다.':'센터를 추가했습니다.');
    });
  }

  // ============================================================
  // 렌더 총괄 / 이벤트 바인딩
  // ============================================================
  async function renderAll(){
    renderSidebar();
    if(currentView.type==='all') await renderAllView();
    else await renderCenterView();
  }

  $('nav-all').addEventListener('click', ()=>{ currentView = {type:'all'}; renderAll(); });
  $('btn-add-center').addEventListener('click', ()=>openCenterModal(null));
  $('side-search').addEventListener('input', ()=>{ searchQuery = $('side-search').value; renderAll(); });

  (async function init(){
    await loadCenters();
    await renderAll();
  })();

})();
</script>
